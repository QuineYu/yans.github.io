<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Yan's Blog</title>
    <style type="text/css">
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Times New Roman", Times, "Songti SC", serif;
            color: #ffffff;
            background-color: #0b0f19;
        }

        .bkg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background-image: url('myimages/background.jpg');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center center;
            z-index: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
        }

        /* 暗色光晕遮罩，增强字画对比度 */
        .bkg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(11, 15, 25, 0.2) 0%, rgba(5, 8, 16, 0.65) 100%);
            z-index: -1;
            pointer-events: none;
        }

        .header-title {
            text-align: center;
            font-size: clamp(2rem, 6vw, 3rem);
            font-weight: 500;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 4px 16px rgba(0, 0, 0, 0.7), 0 0 8px rgba(255, 255, 255, 0.2);
            animation: fadeInDown 0.8s ease-out;
            padding-top: 10px;
        }

        .book-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 10px 0;
        }

        .book {
            width: min(86vw, 560px);
            aspect-ratio: 720 / 428;
            max-height: 52vh;
            max-height: 52dvh;
            background-image: url('myimages/book.png');
            background-repeat: no-repeat;
            background-size: contain;
            background-position: center center;
            filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.55));
            animation: floatBook 4.5s ease-in-out infinite alternate;
            transition: transform 0.3s ease;
        }

        @keyframes floatBook {
            0% {
                transform: translateY(-5px);
            }
            100% {
                transform: translateY(7px);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 底部导航栏：玻璃拟态触控卡片 */
        .footer-nav {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 8px 22px;
            animation: fadeInUp 0.8s ease-out;
            margin-bottom: 4px;
        }

        .nav-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 38px;
            padding: 6px 14px;
            font-size: 15px;
            color: #f1f5f9;
            text-decoration: none;
            letter-spacing: 1px;
            border-radius: 999px;
            transition: all 0.22s ease;
            user-select: none;
        }

        .nav-pill:hover {
            color: #38bdf8;
            background: rgba(255, 255, 255, 0.1);
        }

        .nav-pill:active {
            transform: scale(0.95);
            background: rgba(56, 189, 248, 0.2);
            color: #38bdf8;
        }

        .nav-divider {
            color: rgba(255, 255, 255, 0.35);
            font-size: 14px;
            user-select: none;
        }

        @media (max-width: 480px) {
            .header-title {
                font-size: 1.85rem;
                letter-spacing: 1px;
            }
            .book {
                width: 90vw;
                max-height: 48dvh;
            }
            .footer-nav {
                padding: 6px 16px;
                gap: 8px;
            }
            .nav-pill {
                padding: 6px 10px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="bkg">
        <h1 class="header-title">Yan's Blog</h1>
        <div class="book-container">
            <div class="book" role="img" aria-label="Book Illustration"></div>
        </div>
        <nav class="footer-nav" aria-label="页面导航">
            <a href="./daily.html" class="nav-pill">日月之行</a>
            <span class="nav-divider">|</span>
            <a href="./study.html" class="nav-pill">天之苍苍</a>
        </nav>
    </div>
</body>
</html>
