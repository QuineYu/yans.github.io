<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星彩 Live2D - AI 版</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #f0f4f8;
            background-color: #0d1117;
        }

        /* 全屏背景图片 */
        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('../../myimages/background.jpg');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            z-index: 0;
        }

        /* 优雅暗色遮罩，提升文字对比度 */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, rgba(10, 15, 29, 0.25) 0%, rgba(5, 8, 16, 0.65) 100%);
            z-index: 0;
            pointer-events: none;
        }

        /* Live2D WebGL 画布全屏居中 */
        canvas {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 1 !important;
            display: block !important;
            pointer-events: auto !important;
        }

        /* 顶部导航栏 (玻璃拟态) */
        .top-navbar {
            position: fixed;
            top: 16px;
            left: 20px;
            right: 20px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: rgba(18, 24, 38, 0.65);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
            z-index: 10;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #e2e8f0;
            font-size: 14px;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        .char-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #a5f3fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
            transition: all 0.3s ease;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: currentColor;
            box-shadow: 0 0 8px currentColor;
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.85); }
        }

        .status-badge.offline {
            background: rgba(245, 158, 11, 0.15);
            border-color: rgba(245, 158, 11, 0.3);
            color: #fbbf24;
        }

        .status-badge.speaking {
            background: rgba(59, 130, 246, 0.15);
            border-color: rgba(59, 130, 246, 0.3);
            color: #60a5fa;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-btn {
            padding: 7px 14px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #f1f5f9;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(0, 242, 254, 0.4);
            transform: translateY(-1px);
        }

        /* 动作徽章 */
        .action-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 7px;
            margin: 2px 3px;
            border-radius: 6px;
            font-size: 12px;
            background: rgba(56, 189, 248, 0.2);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #38bdf8;
            font-weight: 500;
        }

        /* 打字机光标 */
        .cursor-blink {
            display: inline-block;
            width: 6px;
            height: 14px;
            background-color: #38bdf8;
            vertical-align: middle;
            margin-left: 2px;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* 背景流星与星空容器 */
        #starsContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 5;
        }

        .sky-star {
            position: absolute;
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            pointer-events: auto;
            transform: translate(-50%, -50%);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 6;
        }

        .sky-star:hover {
            transform: translate(-50%, -50%) scale(1.45);
            z-index: 9;
        }

        .star-icon {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: starFloat 4s ease-in-out infinite alternate, starTwinkle 3s ease-in-out infinite alternate;
        }

        .star-icon svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 6px currentColor) drop-shadow(0 0 14px currentColor);
        }

        @keyframes starFloat {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-5px) rotate(8deg); }
        }

        @keyframes starTwinkle {
            0% { opacity: 0.65; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1.15); }
        }

        @keyframes starBorn {
            0% { transform: translate(-50%, -50%) scale(0) rotate(0deg); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.6) rotate(90deg); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1) rotate(45deg); opacity: 0.95; }
        }

        .star-tooltip {
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%) translateY(4px);
            padding: 6px 12px;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: #f1f5f9;
            font-size: 12px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        }

        .star-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 5px;
            border-style: solid;
            border-color: rgba(15, 23, 42, 0.92) transparent transparent transparent;
        }

        .sky-star:hover .star-tooltip {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        /* 动画特效层 (流星与火花) */
        #effectContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 50;
            overflow: hidden;
        }

        .shooting-meteor {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 16px 4px #38bdf8, 0 0 32px 8px #a5f3fc;
            pointer-events: none;
            transform-origin: center center;
        }

        .shooting-meteor-tail {
            position: absolute;
            top: 50%;
            right: 2px;
            transform: translateY(-50%);
            width: 180px;
            height: 3px;
            background: linear-gradient(to left, #ffffff 10%, #38bdf8 50%, rgba(56, 189, 248, 0) 100%);
            border-radius: 999px;
            filter: drop-shadow(0 0 6px #38bdf8);
        }

        .stardust-spark {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            background: #ffffff;
            animation: sparkFade 0.6s ease-out forwards;
        }

        @keyframes sparkFade {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
        }

        /* 当前对话气泡 (正在进行的对话) */
        .active-dialog-bubble {
            position: fixed;
            right: 36px;
            bottom: 96px;
            width: 440px;
            max-width: calc(100vw - 48px);
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 20px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
            z-index: 20;
            display: flex;
            flex-direction: column;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.9) translateY(20px);
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.3s;
            overflow: hidden;
        }

        .active-dialog-bubble.visible {
            opacity: 1;
            visibility: visible;
            transform: scale(1) translateY(0);
        }

        .active-dialog-bubble.condensing {
            transform: scale(0.05) translate(40px, -40px);
            opacity: 0;
            filter: blur(6px);
            transition: all 0.4s cubic-bezier(0.4, 0, 1, 1);
        }

        .active-bubble-header {
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.03);
            font-size: 13px;
            color: #94a3b8;
        }

        .condense-btn {
            background: rgba(56, 189, 248, 0.18);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #38bdf8;
            border-radius: 12px;
            padding: 3px 10px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .condense-btn:hover {
            background: rgba(56, 189, 248, 0.35);
            border-color: rgba(56, 189, 248, 0.7);
            color: #ffffff;
            transform: translateY(-1px);
        }

        .active-bubble-body {
            padding: 16px;
            max-height: 360px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            user-select: text;
        }

        .active-bubble-body::-webkit-scrollbar {
            width: 5px;
        }
        .active-bubble-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.18);
            border-radius: 4px;
        }

        .bubble-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
            animation: fadeIn 0.25s ease-out;
        }

        .bubble-row.user {
            align-items: flex-end;
        }

        .bubble-row.ai {
            align-items: flex-start;
        }

        .bubble-label {
            font-size: 11px;
            color: #64748b;
            padding: 0 4px;
        }

        .bubble-text {
            max-width: 90%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.55;
            word-break: break-word;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
        }

        .bubble-text.user {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #ffffff;
            border-bottom-right-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .bubble-text.ai {
            background: rgba(30, 41, 59, 0.85);
            color: #f1f5f9;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        /* 倒计时进度条 */
        .bubble-collapse-progress {
            height: 2px;
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            position: relative;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #38bdf8, #a5f3fc);
            transition: width linear;
        }

        /* 历史对话查看弹窗 (点击星星弹出) */
        .history-bubble-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 90;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .history-bubble-overlay.active {
            display: flex;
        }

        .history-bubble-card {
            width: 500px;
            max-width: calc(100vw - 36px);
            max-height: 80vh;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: modalIn 0.25s ease-out;
        }

        .history-card-header {
            padding: 14px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
        }

        .history-card-body {
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            user-select: text;
        }

        .history-card-footer {
            padding: 12px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.02);
        }

        /* 底部居中输入底栏 */
        .bottom-dock {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: 720px;
            max-width: calc(100vw - 32px);
            z-index: 10;
        }

        .input-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .input-field {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 15px;
            padding: 6px 8px;
            user-select: text;
        }

        .input-field::placeholder {
            color: transparent;
        }

        .send-btn {
            padding: 9px 20px;
            border-radius: 18px;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            border: none;
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.35);
        }

        .send-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(2, 132, 199, 0.5);
        }

        .send-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* 模态框通用遮罩 (用于设置等对话框) */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .drawer-overlay.active {
            display: flex;
        }

        .drawer-box {
            width: 520px;
            max-width: 90vw;
            max-height: 85vh;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: modalIn 0.25s ease-out;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .drawer-header {
            padding: 16px 22px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
        }

        .close-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 20px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: #ffffff;
        }

        .drawer-content {
            padding: 20px 22px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .drawer-section-title {
            font-size: 13px;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 13px;
            color: #cbd5e1;
        }

        .form-input, .form-textarea {
            padding: 10px 14px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ffffff;
            font-size: 14px;
            outline: none;
            user-select: text;
        }

        .form-input:focus, .form-textarea:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }

        .form-textarea {
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
        }

        .drawer-footer {
            padding: 14px 22px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 响应式适配 */
        @media (max-width: 768px) {
            .top-navbar {
                left: 10px;
                right: 10px;
                padding: 0 12px;
            }
            .active-dialog-bubble {
                right: 10px;
                left: 10px;
                width: auto;
                bottom: 90px;
                max-height: 50vh;
            }
            .bottom-dock {
                left: 10px;
                right: 10px;
                transform: none;
                width: auto;
            }
        }
    </style>

    <!-- 配置标志：隐藏 WebGL 内部背景图与齿轮，使画布透明显示 background.jpg；设置模型缩放 -->
    <script>
        window.hideLive2DBackground = true;
        window.hideLive2DGear = true;
        window.live2dModelScale = 0.9; // 模型缩小至当前的 90%
    </script>

    <!-- Live2D Cubism Core & 依赖 -->
    <script src="https://unpkg.com/core-js-bundle@3.6.1/minified.js"></script>
    <script src="../../Core/live2dcubismcore.js"></script>
    <!-- 控制器与动作引擎 -->
    <script src="./chat_controller.js"></script>
    <!-- Live2D WebGL 渲染管线 -->
    <script type="module" crossorigin src="../../assets/index-4PtOunvL.js?v=5"></script>
</head>

<body>
    <!-- 背景层 -->
    <div class="bg-layer"></div>
    <div class="bg-overlay"></div>

    <!-- 顶部导航栏 -->
    <header class="top-navbar">
        <div class="nav-left">
            <a href="../../study.html" class="back-btn" title="返回笔记目录">
                <span>←</span> 返回笔记
            </a>
            <div class="char-title">
                <span>星彩 Live2D (AI 版)</span>
                <span class="status-badge" id="statusBadge">
                    <span class="status-dot"></span>
                    <span id="statusText">初始化中...</span>
                </span>
            </div>
        </div>

        <div class="nav-actions">
            <button class="nav-btn" id="openSettingsBtn" title="配置本地大模型接口">
                <span>⚙️</span> 模型设置
            </button>
            <button class="nav-btn" id="clearChatBtn" title="清理夜空中的所有对话星辰">
                <span>🧹</span> 清理星空
            </button>
        </div>
    </header>

    <!-- 背景夜空星辰容器 -->
    <div id="starsContainer"></div>

    <!-- 流星与粒子特效层 -->
    <div id="effectContainer"></div>

    <!-- 当前进行中的对话气泡 (无初始预设文字) -->
    <div class="active-dialog-bubble" id="activeDialogBubble">
        <div class="active-bubble-header">
            <span class="active-bubble-title" id="activeBubbleTitle">✨ 交流中...</span>
            <button class="condense-btn" id="condenseStarBtn" title="将当前对话收纳为流星">
                <span>⭐ 凝成星辰</span>
            </button>
        </div>
        <div class="active-bubble-body" id="activeBubbleBody">
            <div class="bubble-row user" id="activeUserRow">
                <div class="bubble-label">🧑 您</div>
                <div class="bubble-text user" id="activeUserText"></div>
            </div>
            <div class="bubble-row ai" id="activeAiRow">
                <div class="bubble-label">🌸 星彩</div>
                <div class="bubble-text ai" id="activeAiText"></div>
            </div>
        </div>
        <div class="bubble-collapse-progress">
            <div class="progress-bar" id="collapseProgressBar"></div>
        </div>
    </div>

    <!-- 历史对话查看气泡卡片 (点击夜空星星弹出) -->
    <div class="history-bubble-overlay" id="historyBubbleModal">
        <div class="history-bubble-card">
            <div class="history-card-header">
                <div class="history-title" id="historyModalTitle">✨ 对话星辰</div>
                <button class="close-btn" id="closeHistoryModalBtn">×</button>
            </div>
            <div class="history-card-body">
                <div class="bubble-row user">
                    <div class="bubble-label">🧑 您</div>
                    <div class="bubble-text user" id="historyUserMsg"></div>
                </div>
                <div class="bubble-row ai">
                    <div class="bubble-label">🌸 星彩</div>
                    <div class="bubble-text ai" id="historyAiMsg"></div>
                </div>
            </div>
            <div class="history-card-footer">
                <button class="nav-btn" id="historyReplayBtn" title="让星彩重温本次对话动作">
                    <span>👄</span> 重温动作与语音
                </button>
                <div style="flex:1"></div>
                <button class="nav-btn" id="historyDeleteBtn" style="color:#f87171;border-color:rgba(248,113,113,0.3);" title="从星空中放飞这颗星星">
                    <span>🗑️</span> 放飞
                </button>
                <button class="send-btn" id="closeHistoryModalConfirmBtn" style="padding:7px 18px;">
                    关闭
                </button>
            </div>
        </div>
    </div>

    <!-- 底部固定输入区 (无任何预设文字提示) -->
    <div class="bottom-dock">
        <div class="input-bar">
            <input type="text" id="chatInput" class="input-field" placeholder="" autocomplete="off">
            <button id="sendBtn" class="send-btn">
                <span>发送</span> 🚀
            </button>
        </div>
    </div>

    <!-- 本地大模型设置模态框 -->
    <div class="drawer-overlay" id="settingsDrawer">
        <div class="drawer-box">
            <div class="drawer-header">
                <span>⚙️ 本地大模型服务设置</span>
                <button class="close-btn" id="closeSettingsBtn">×</button>
            </div>
            <div class="drawer-content">
                <div class="form-group">
                    <label class="form-label">API 基础地址 (Base URL)</label>
                    <input type="text" id="settingBaseUrl" class="form-input" placeholder="http://localhost:11434/v1">
                    <small style="color:#64748b;font-size:12px;">支持 Ollama (11434/v1), LM Studio (1234/v1), vLLM (8000/v1) 等</small>
                </div>

                <div class="form-group">
                    <label class="form-label">模型名称 (Model Name)</label>
                    <input type="text" id="settingModelName" class="form-input" placeholder="qwen2.5:7b">
                </div>

                <div class="form-group">
                    <label class="form-label">API Key (若有)</label>
                    <input type="password" id="settingApiKey" class="form-input" placeholder="可选，本地服务一般无需输入">
                </div>

                <div class="form-group">
                    <label class="form-label">系统 Prompt (包含动作控制指引)</label>
                    <textarea id="settingSystemPrompt" class="form-textarea" rows="4"></textarea>
                </div>

                <div style="display:flex;gap:10px;">
                    <button class="nav-btn" id="testConnectionBtn">🔍 测试连线与自动发现模型</button>
                    <span id="testConnResult" style="font-size:13px;align-self:center;"></span>
                </div>
            </div>
            <div class="drawer-footer">
                <button class="nav-btn" id="resetSettingsBtn">恢复默认</button>
                <button class="send-btn" id="saveSettingsBtn">保存配置</button>
            </div>
        </div>
    </div>

    <!-- 主交互逻辑脚本 -->
    <script>
        // DOM 元素引用
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusBadge = document.getElementById('statusBadge');
        const statusText = document.getElementById('statusText');
        const clearChatBtn = document.getElementById('clearChatBtn');

        const starsContainer = document.getElementById('starsContainer');
        const effectContainer = document.getElementById('effectContainer');

        // 当前进行中对话气泡
        const activeDialogBubble = document.getElementById('activeDialogBubble');
        const activeBubbleTitle = document.getElementById('activeBubbleTitle');
        const activeUserText = document.getElementById('activeUserText');
        const activeAiText = document.getElementById('activeAiText');
        const condenseStarBtn = document.getElementById('condenseStarBtn');
        const collapseProgressBar = document.getElementById('collapseProgressBar');

        // 历史对话查看弹窗
        const historyBubbleModal = document.getElementById('historyBubbleModal');
        const historyModalTitle = document.getElementById('historyModalTitle');
        const historyUserMsg = document.getElementById('historyUserMsg');
        const historyAiMsg = document.getElementById('historyAiMsg');
        const historyReplayBtn = document.getElementById('historyReplayBtn');
        const historyDeleteBtn = document.getElementById('historyDeleteBtn');
        const closeHistoryModalBtn = document.getElementById('closeHistoryModalBtn');
        const closeHistoryModalConfirmBtn = document.getElementById('closeHistoryModalConfirmBtn');

        // 模型设置 Drawer
        const settingsDrawer = document.getElementById('settingsDrawer');
        const openSettingsBtn = document.getElementById('openSettingsBtn');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn');
        const saveSettingsBtn = document.getElementById('saveSettingsBtn');
        const resetSettingsBtn = document.getElementById('resetSettingsBtn');
        const testConnectionBtn = document.getElementById('testConnectionBtn');
        const testConnResult = document.getElementById('testConnResult');

        const settingBaseUrl = document.getElementById('settingBaseUrl');
        const settingModelName = document.getElementById('settingModelName');
        const settingApiKey = document.getElementById('settingApiKey');
        const settingSystemPrompt = document.getElementById('settingSystemPrompt');

        // 星辰色彩调色板 (亮色/柔和发光)
        const STAR_PALETTE = [
            { color: '#38bdf8', glow: 'rgba(56, 189, 248, 0.65)' }, // 天空青
            { color: '#facc15', glow: 'rgba(250, 204, 21, 0.65)' }, // 晨曦金
            { color: '#c084fc', glow: 'rgba(192, 132, 252, 0.65)' }, // 星云紫
            { color: '#34d399', glow: 'rgba(52, 211, 153, 0.65)' }, // 翡翠翠
            { color: '#f472b6', glow: 'rgba(244, 114, 182, 0.65)' }, // 樱花粉
            { color: '#67e8f9', glow: 'rgba(103, 232, 249, 0.65)' }  // 极光碧
        ];

        // 状态变量
        let chatHistory = [];
        let starHistory = [];
        let currentActiveDialogue = null;
        let isGenerating = false;
        let isServerOnline = false;

        // 倒计时管理
        let countdownRemaining = 4000;
        let countdownStartTime = 0;
        let countdownTimer = null;
        let isBubbleHovered = false;

        // 初始化
        window.addEventListener('DOMContentLoaded', async () => {
            initSettingsForm();
            loadStarHistory();
            await checkServerStatus();
        });

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, (m) => {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
            });
        }

        function initSettingsForm() {
            settingBaseUrl.value = window.localLLMClient.baseUrl;
            settingModelName.value = window.localLLMClient.modelName;
            settingApiKey.value = window.localLLMClient.apiKey;
            settingSystemPrompt.value = window.localLLMClient.systemPrompt;
        }

        async function checkServerStatus() {
            statusBadge.className = 'status-badge';
            statusText.innerText = '检测服务...';
            const res = await window.localLLMClient.checkHealth();
            if (res.ok) {
                isServerOnline = true;
                statusBadge.className = 'status-badge';
                statusText.innerText = '本地大模型已连接';
            } else {
                isServerOnline = false;
                statusBadge.className = 'status-badge offline';
                statusText.innerText = '演示模式 (本地模型离线)';
            }
        }

        // ==========================================
        // 星辰背景与历史记录管理
        // ==========================================
        function loadStarHistory() {
            try {
                const stored = localStorage.getItem('xingcai_star_history');
                if (stored) {
                    starHistory = JSON.parse(stored);
                    starsContainer.innerHTML = '';
                    starHistory.forEach(item => {
                        const starEl = createStarElement(item);
                        starsContainer.appendChild(starEl);
                    });
                }
            } catch (e) {
                console.warn('加载历史星辰失败:', e);
                starHistory = [];
            }
        }

        // 避开中间 Live2D 人物立绘的安全星空区域
        function getRandomStarPosition() {
            const zones = [
                { minX: 6, maxX: 30, minY: 14, maxY: 82 },   // 左侧夜空
                { minX: 70, maxX: 94, minY: 14, maxY: 82 },  // 右侧夜空
                { minX: 32, maxX: 68, minY: 12, maxY: 24 }   // 顶部夜空
            ];
            const r = Math.random();
            const zone = r < 0.45 ? zones[0] : (r < 0.90 ? zones[1] : zones[2]);
            const x = Math.round(zone.minX + Math.random() * (zone.maxX - zone.minX));
            const y = Math.round(zone.minY + Math.random() * (zone.maxY - zone.minY));
            return { x, y };
        }

        function createStarElement(starData) {
            const el = document.createElement('div');
            el.className = 'sky-star';
            el.id = `star-${starData.id}`;
            el.style.left = `${starData.x}%`;
            el.style.top = `${starData.y}%`;
            el.style.color = starData.color.color;

            const delay = (Math.random() * 3).toFixed(1);
            const duration = (2.8 + Math.random() * 2).toFixed(1);
            const shortText = (starData.userText || '').substring(0, 18);

            el.innerHTML = `
                <div class="star-icon" style="animation-delay: ${delay}s; animation-duration: ${duration}s;">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 0 L14.8 9.2 L24 12 L14.8 14.8 L12 24 L9.2 14.8 L0 12 L9.2 9.2 Z" fill="currentColor" />
                    </svg>
                </div>
                <div class="star-tooltip">
                    <div style="font-weight:600;color:${starData.color.color};margin-bottom:2px;">✨ 记忆星芒</div>
                    <div style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(shortText)}</div>
                </div>
            `;

            el.addEventListener('click', (e) => {
                e.stopPropagation();
                openHistoryBubble(starData);
            });

            return el;
        }

        function deleteStar(id) {
            const starEl = document.getElementById(`star-${id}`);
            if (starEl) {
                starEl.style.transform = 'translate(-50%, -50%) scale(0)';
                starEl.style.opacity = '0';
                setTimeout(() => starEl.remove(), 300);
            }
            starHistory = starHistory.filter(s => s.id !== id);
            localStorage.setItem('xingcai_star_history', JSON.stringify(starHistory));
        }

        clearChatBtn.addEventListener('click', () => {
            if (starHistory.length === 0 && !currentActiveDialogue) return;
            if (confirm('确定要清理夜空中的所有对话星辰吗？')) {
                starsContainer.innerHTML = '';
                starHistory = [];
                localStorage.removeItem('xingcai_star_history');
                if (currentActiveDialogue) {
                    clearCollapseCountdown();
                    currentActiveDialogue = null;
                    activeDialogBubble.classList.remove('visible', 'condensing');
                }
            }
        });

        // ==========================================
        // 流星划过与粒子特效
        // ==========================================
        function shootMeteor(fromX, fromY, toX, toY, colorObj, onComplete) {
            const meteor = document.createElement('div');
            meteor.className = 'shooting-meteor';
            meteor.style.left = `${fromX}px`;
            meteor.style.top = `${fromY}px`;
            meteor.style.backgroundColor = '#ffffff';
            meteor.style.boxShadow = `0 0 16px 4px ${colorObj.color}, 0 0 32px 8px ${colorObj.glow}`;

            const tail = document.createElement('div');
            tail.className = 'shooting-meteor-tail';
            tail.style.background = `linear-gradient(to left, #ffffff 10%, ${colorObj.color} 50%, rgba(0,0,0,0) 100%)`;
            tail.style.filter = `drop-shadow(0 0 6px ${colorObj.color})`;
            meteor.appendChild(tail);

            effectContainer.appendChild(meteor);

            const deltaX = toX - fromX;
            const deltaY = toY - fromY;
            const angleDeg = Math.atan2(deltaY, deltaX) * (180 / Math.PI);

            const anim = meteor.animate([
                { transform: `translate(0px, 0px) rotate(${angleDeg}deg) scale(0.2)`, opacity: 0 },
                { transform: `translate(${deltaX * 0.15}px, ${deltaY * 0.15}px) rotate(${angleDeg}deg) scale(1)`, opacity: 1, offset: 0.15 },
                { transform: `translate(${deltaX * 0.9}px, ${deltaY * 0.9}px) rotate(${angleDeg}deg) scale(0.85)`, opacity: 1, offset: 0.9 },
                { transform: `translate(${deltaX}px, ${deltaY}px) rotate(${angleDeg}deg) scale(0.1)`, opacity: 0, offset: 1 }
            ], {
                duration: 750,
                easing: 'cubic-bezier(0.22, 0.61, 0.36, 1)'
            });

            anim.onfinish = () => {
                meteor.remove();
                spawnStardustBurst(toX, toY, colorObj.color);
                if (onComplete) onComplete();
            };
        }

        function spawnStardustBurst(x, y, color) {
            const particleCount = 8;
            for (let i = 0; i < particleCount; i++) {
                const p = document.createElement('div');
                p.className = 'stardust-spark';
                const angle = (i / particleCount) * Math.PI * 2 + (Math.random() * 0.5);
                const dist = 18 + Math.random() * 24;
                const dx = Math.cos(angle) * dist;
                const dy = Math.sin(angle) * dist;
                const size = 3 + Math.random() * 3;

                p.style.left = `${x}px`;
                p.style.top = `${y}px`;
                p.style.width = `${size}px`;
                p.style.height = `${size}px`;
                p.style.backgroundColor = color;
                p.style.boxShadow = `0 0 8px ${color}`;
                p.style.setProperty('--dx', `${dx}px`);
                p.style.setProperty('--dy', `${dy}px`);
                effectContainer.appendChild(p);

                setTimeout(() => p.remove(), 600);
            }
        }

        // ==========================================
        // 当前对话气泡管理与流星收纳
        // ==========================================
        function startCollapseCountdown() {
            clearCollapseCountdown();
            countdownRemaining = 4000;
            runCountdownStep();
        }

        function runCountdownStep() {
            countdownStartTime = Date.now();
            countdownTimer = setTimeout(() => {
                condenseCurrentBubble();
            }, countdownRemaining);
            collapseProgressBar.style.transition = `width ${countdownRemaining}ms linear`;
            collapseProgressBar.style.width = '100%';
        }

        function pauseCollapseCountdown() {
            if (countdownTimer && !isBubbleHovered) {
                isBubbleHovered = true;
                clearTimeout(countdownTimer);
                countdownTimer = null;
                const elapsed = Date.now() - countdownStartTime;
                countdownRemaining = Math.max(0, countdownRemaining - elapsed);
                const computedWidth = collapseProgressBar.getBoundingClientRect().width;
                const parentWidth = collapseProgressBar.parentElement.getBoundingClientRect().width;
                const pct = parentWidth > 0 ? (computedWidth / parentWidth) * 100 : 0;
                collapseProgressBar.style.transition = 'none';
                collapseProgressBar.style.width = `${pct}%`;
            }
        }

        function resumeCollapseCountdown() {
            if (isBubbleHovered && currentActiveDialogue) {
                isBubbleHovered = false;
                if (countdownRemaining > 150) {
                    runCountdownStep();
                } else {
                    condenseCurrentBubble();
                }
            }
        }

        function clearCollapseCountdown() {
            if (countdownTimer) {
                clearTimeout(countdownTimer);
                countdownTimer = null;
            }
            isBubbleHovered = false;
            collapseProgressBar.style.transition = 'none';
            collapseProgressBar.style.width = '0%';
        }

        activeDialogBubble.addEventListener('mouseenter', pauseCollapseCountdown);
        activeDialogBubble.addEventListener('mouseleave', resumeCollapseCountdown);
        condenseStarBtn.addEventListener('click', () => {
            condenseCurrentBubble();
        });

        function condenseCurrentBubble() {
            if (!currentActiveDialogue) return;
            clearCollapseCountdown();

            const bubble = activeDialogBubble;
            const rect = bubble.getBoundingClientRect();
            const fromX = rect.left + rect.width / 2;
            const fromY = rect.top + rect.height / 2;

            const pos = getRandomStarPosition();
            const toX = (pos.x / 100) * window.innerWidth;
            const toY = (pos.y / 100) * window.innerHeight;
            const colorObj = STAR_PALETTE[Math.floor(Math.random() * STAR_PALETTE.length)];

            const starData = {
                id: currentActiveDialogue.id,
                userText: currentActiveDialogue.userText,
                aiText: currentActiveDialogue.aiText,
                time: currentActiveDialogue.time,
                x: pos.x,
                y: pos.y,
                color: colorObj
            };

            currentActiveDialogue = null;
            bubble.classList.add('condensing');

            shootMeteor(fromX, fromY, toX, toY, colorObj, () => {
                const starEl = createStarElement(starData);
                starEl.style.animation = 'starBorn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards';
                starsContainer.appendChild(starEl);

                starHistory.push(starData);
                localStorage.setItem('xingcai_star_history', JSON.stringify(starHistory));

                bubble.classList.remove('visible', 'condensing');
            });
        }

        // ==========================================
        // 历史对话查看弹窗
        // ==========================================
        function openHistoryBubble(starData) {
            historyModalTitle.innerHTML = `<span style="color:${starData.color.color};">✦</span> 对话星辰 · <span style="font-size:12px;color:#94a3b8;font-weight:normal;">${starData.time || ''}</span>`;
            historyUserMsg.innerText = starData.userText;
            historyAiMsg.innerHTML = formatActionTags(starData.aiText);

            historyReplayBtn.onclick = () => {
                window.live2dMotionEngine.setSpeaking(true);
                const matches = starData.aiText.match(/\[(点头|摇头|歪头|害羞|脸红|眨眼|卖萌|微笑|开心|思考|沉思|惊讶|吃惊|换衣服|外套|脱外套|穿外套|裙子1|裙子2|nod|shake|tilt|blush|wink|smile|think|surprise|jacket|skirt1|skirt2)\]/gi);
                if (matches) {
                    matches.forEach(t => window.live2dMotionEngine.triggerAction(t.replace(/[\[\]]/g, '')));
                }
                setTimeout(() => window.live2dMotionEngine.setSpeaking(false), 3000);
            };

            historyDeleteBtn.onclick = () => {
                deleteStar(starData.id);
                closeHistoryBubble();
            };

            historyBubbleModal.classList.add('active');
        }

        function closeHistoryBubble() {
            historyBubbleModal.classList.remove('active');
        }

        closeHistoryModalBtn.addEventListener('click', closeHistoryBubble);
        closeHistoryModalConfirmBtn.addEventListener('click', closeHistoryBubble);
        historyBubbleModal.addEventListener('click', (e) => {
            if (e.target === historyBubbleModal) {
                closeHistoryBubble();
            }
        });
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeHistoryBubble();
                settingsDrawer.classList.remove('active');
            }
        });

        // ==========================================
        // 消息发送与流式响应逻辑
        // ==========================================
        function formatActionTags(rawText) {
            return rawText.replace(/\[(点头|摇头|歪头|害羞|脸红|眨眼|卖萌|微笑|开心|思考|沉思|惊讶|吃惊|换衣服|外套|脱外套|穿外套|裙子1|裙子2|nod|shake|tilt|blush|wink|smile|think|surprise|jacket|skirt1|skirt2)\]/gi, (match) => {
                return `<span class="action-tag">🏷️ ${match.replace(/[\[\]]/g, '')}</span>`;
            });
        }

        async function handleSend() {
            const text = chatInput.value.trim();
            if (!text || isGenerating) return;

            // 如果上一段对话还在气泡等待倒计时，立刻收为流星
            if (currentActiveDialogue) {
                condenseCurrentBubble();
            }

            chatInput.value = '';
            isGenerating = true;
            sendBtn.disabled = true;

            // 显示当前活跃气泡
            activeBubbleTitle.innerText = '✨ 交流中...';
            activeUserText.innerText = text;
            activeAiText.innerHTML = '<span class="cursor-blink"></span>';
            clearCollapseCountdown();
            activeDialogBubble.classList.remove('condensing');
            activeDialogBubble.classList.add('visible');

            chatHistory.push({ role: 'user', content: text });

            // 角色状态：思考中
            statusBadge.className = 'status-badge speaking';
            statusText.innerText = '星彩正在思考...';
            window.live2dMotionEngine.think(2.0);

            if (isServerOnline) {
                await sendToLocalLLM();
            } else {
                await sendToMockEngine(text);
            }

            isGenerating = false;
            sendBtn.disabled = false;
            if (isServerOnline) {
                statusBadge.className = 'status-badge';
                statusText.innerText = '本地大模型已连接';
            } else {
                statusBadge.className = 'status-badge offline';
                statusText.innerText = '演示模式 (本地模型离线)';
            }
            window.live2dMotionEngine.setSpeaking(false);
        }

        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });
        sendBtn.addEventListener('click', handleSend);

        async function sendToLocalLLM() {
            let fullContent = '';
            let parsedTags = new Set();
            window.live2dMotionEngine.setSpeaking(true);
            statusText.innerText = '星彩正在回复...';

            await new Promise((resolve) => {
                window.localLLMClient.chatStream(
                    chatHistory,
                    (chunk) => {
                        fullContent += chunk;
                        const matches = fullContent.match(/\[(点头|摇头|歪头|害羞|脸红|眨眼|卖萌|微笑|开心|思考|沉思|惊讶|吃惊|换衣服|外套|脱外套|穿外套|裙子1|裙子2|nod|shake|tilt|blush|wink|smile|think|surprise|jacket|skirt1|skirt2)\]/gi);
                        if (matches) {
                            for (const tag of matches) {
                                const clean = tag.replace(/[\[\]]/g, '').toLowerCase();
                                if (!parsedTags.has(clean)) {
                                    parsedTags.add(clean);
                                    window.live2dMotionEngine.triggerAction(clean);
                                }
                            }
                        }
                        activeAiText.innerHTML = formatActionTags(fullContent) + '<span class="cursor-blink"></span>';
                    },
                    () => {
                        activeAiText.innerHTML = formatActionTags(fullContent);
                        chatHistory.push({ role: 'assistant', content: fullContent });
                        onDialogueComplete(chatHistory[chatHistory.length - 2].content, fullContent);
                        resolve();
                    },
                    (err) => {
                        console.warn('本地大模型流式传输中断，切换为演示应答:', err);
                        const fallback = window.localLLMClient.getMockResponse(chatHistory[chatHistory.length - 1].content);
                        typewriterOutput(fallback, resolve);
                    }
                );
            });
        }

        async function sendToMockEngine(userText) {
            const mockReply = window.localLLMClient.getMockResponse(userText);
            await new Promise((resolve) => {
                typewriterOutput(mockReply, resolve);
            });
        }

        function typewriterOutput(fullText, onFinished) {
            let index = 0;
            let currentText = '';
            let parsedTags = new Set();
            window.live2dMotionEngine.setSpeaking(true);
            statusText.innerText = '星彩正在回复...';

            const timer = setInterval(() => {
                if (index < fullText.length) {
                    currentText += fullText[index];
                    index++;

                    const matches = currentText.match(/\[(点头|摇头|歪头|害羞|脸红|眨眼|卖萌|微笑|开心|思考|沉思|惊讶|吃惊|换衣服|外套|脱外套|穿外套|裙子1|裙子2|nod|shake|tilt|blush|wink|smile|think|surprise|jacket|skirt1|skirt2)\]/gi);
                    if (matches) {
                        for (const tag of matches) {
                            const clean = tag.replace(/[\[\]]/g, '').toLowerCase();
                            if (!parsedTags.has(clean)) {
                                parsedTags.add(clean);
                                window.live2dMotionEngine.triggerAction(clean);
                            }
                        }
                    }

                    activeAiText.innerHTML = formatActionTags(currentText) + '<span class="cursor-blink"></span>';
                } else {
                    clearInterval(timer);
                    activeAiText.innerHTML = formatActionTags(fullText);
                    chatHistory.push({ role: 'assistant', content: fullText });
                    onDialogueComplete(chatHistory[chatHistory.length - 2].content, fullText);
                    onFinished();
                }
            }, 38);
        }

        function onDialogueComplete(userText, aiText) {
            activeBubbleTitle.innerText = '✨ 对话完成';
            currentActiveDialogue = {
                id: Date.now(),
                userText: userText,
                aiText: aiText,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };
            startCollapseCountdown();
        }

        // ==========================================
        // 模型设置 Drawer 交互
        // ==========================================
        openSettingsBtn.addEventListener('click', () => {
            initSettingsForm();
            testConnResult.innerText = '';
            settingsDrawer.classList.add('active');
        });
        closeSettingsBtn.addEventListener('click', () => {
            settingsDrawer.classList.remove('active');
        });

        testConnectionBtn.addEventListener('click', async () => {
            testConnResult.style.color = '#38bdf8';
            testConnResult.innerText = '正在测试...';
            window.localLLMClient.saveSettings({
                baseUrl: settingBaseUrl.value,
                modelName: settingModelName.value,
                apiKey: settingApiKey.value
            });
            const res = await window.localLLMClient.checkHealth();
            if (res.ok) {
                testConnResult.style.color = '#34d399';
                testConnResult.innerText = '✅ 连接成功！检测到服务运行中';
                checkServerStatus();
            } else {
                testConnResult.style.color = '#f87171';
                testConnResult.innerText = '❌ 连接失败: ' + res.error;
            }
        });

        saveSettingsBtn.addEventListener('click', async () => {
            window.localLLMClient.saveSettings({
                baseUrl: settingBaseUrl.value,
                modelName: settingModelName.value,
                apiKey: settingApiKey.value,
                systemPrompt: settingSystemPrompt.value
            });
            settingsDrawer.classList.remove('active');
            await checkServerStatus();
        });

        resetSettingsBtn.addEventListener('click', () => {
            localStorage.removeItem('llm_base_url');
            localStorage.removeItem('llm_model_name');
            localStorage.removeItem('llm_api_key');
            localStorage.removeItem('llm_system_prompt');
            window.localLLMClient.loadSettings();
            initSettingsForm();
            testConnResult.innerText = '已恢复默认设置';
        });
    </script>
</body>
</html>
