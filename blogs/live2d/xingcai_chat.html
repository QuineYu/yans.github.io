<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星彩 Live2D - AI 版</title>
    <style>
        /* ==========================================================================
           🎨 外观与交互定制接口 (Customization Interface)
           后续修改光标、发送按钮小图标等配置，可直接调整此处的 CSS 变量或在 JS 中调用
           ========================================================================== */
        :root {
            /* 1. 光标样式接口 (Custom Cursors)
             * 更换光标示例:
             *   --app-cursor-default: url('../../assets/normal.cur'), auto;
             *   --app-cursor-pointer: url('../../assets/pointer.cur'), pointer;
             *   --app-cursor-text: url('../../assets/text.cur'), text;
             */
            --app-cursor-default: default;
            --app-cursor-pointer: pointer;
            --app-cursor-text: text;

            /* 2. 发送按键定制接口 (Send Button Interface)
             * - 尺寸与圆角 (小方块设计):
             *   --send-btn-size: 方块边长 (默认 36px)
             *   --send-btn-radius: 圆角 (默认 8px，0px为硬朗纯方块)
             * - 颜色与图标:
             *   --send-btn-bg: 背景颜色/渐变
             *   --send-btn-hover-bg: 鼠标悬浮背景
             *   --send-btn-color: 图标/文字颜色
             *   --send-btn-icon-image: 自定义图标背景图 (若后续更换为图片/SVG文件，填入如 url('icon.svg'))
             */
            --send-btn-size: 36px;
            --send-btn-radius: 8px;
            --send-btn-bg: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            --send-btn-hover-bg: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            --send-btn-color: #ffffff;
            --send-btn-icon-image: none; /* 例: url('../../myimages/send_icon.svg') */

            /* 3. 星系公转定制接口 (Celestial Orbit Interface)
             * - 公转中心与周期:
             *   --stars-orbit-x: 公转中心水平位置 (默认 50%，即 0.5w)
             *   --stars-orbit-y: 公转中心垂直位置 (默认 80%，即 0.8h)
             *   --stars-orbit-duration: 顺时针旋转一圈耗时 (默认 240s)
             */
            --stars-orbit-x: 50%;
            --stars-orbit-y: 80%;
            --stars-orbit-duration: 240s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #f0f4f8;
            background-color: #0d1117;
            cursor: var(--app-cursor-default);
        }

        /* 全屏背景图片 */
        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('../../myimages/background.jpg');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            z-index: 0;
        }

        /* 优雅暗色遮罩，提升文字对比度 */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, rgba(10, 15, 29, 0.25) 0%, rgba(5, 8, 16, 0.65) 100%);
            z-index: 0;
            pointer-events: none;
        }

        /* Live2D WebGL 画布全屏居中 */
        canvas {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 1 !important;
            display: block !important;
            pointer-events: auto !important;
        }

        /* 顶部导航栏 (玻璃拟态) */
        .top-navbar {
            position: fixed;
            top: 16px;
            left: 20px;
            right: 20px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: rgba(18, 24, 38, 0.65);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
            z-index: 10;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #e2e8f0;
            font-size: 14px;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        .char-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #a5f3fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
            transition: all 0.3s ease;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: currentColor;
            box-shadow: 0 0 8px currentColor;
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.85); }
        }

        .status-badge.offline {
            background: rgba(245, 158, 11, 0.15);
            border-color: rgba(245, 158, 11, 0.3);
            color: #fbbf24;
        }

        .status-badge.speaking {
            background: rgba(59, 130, 246, 0.15);
            border-color: rgba(59, 130, 246, 0.3);
            color: #60a5fa;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-btn {
            padding: 7px 14px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #f1f5f9;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(0, 242, 254, 0.4);
            transform: translateY(-1px);
        }

        /* 动作徽章 */
        .action-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 7px;
            margin: 2px 3px;
            border-radius: 6px;
            font-size: 12px;
            background: rgba(56, 189, 248, 0.2);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #38bdf8;
            font-weight: 500;
        }

        /* 打字机光标 */
        .cursor-blink {
            display: inline-block;
            width: 6px;
            height: 14px;
            background-color: #38bdf8;
            vertical-align: middle;
            margin-left: 2px;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* 背景流星与星空容器：所有星星绕着屏幕 (0.5w, 0.8h) 顺时针缓慢公转 */
        #starsContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 5;
            transform-origin: var(--stars-orbit-x, 50%) var(--stars-orbit-y, 80%);
            animation: celestialOrbitClockwise var(--stars-orbit-duration, 240s) linear infinite;
        }

        @keyframes celestialOrbitClockwise {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .sky-star {
            position: absolute;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: var(--app-cursor-pointer);
            pointer-events: auto;
            transform: translate(-50%, -50%);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 6;
        }

        .sky-star:hover {
            transform: translate(-50%, -50%) scale(1.45);
            z-index: 10;
        }

        /* 0. 公转逆向补偿层 (抵消星空容器整体公转，使提示框与星辰本体朝向恒定正向) */
        .star-counter-orbit {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-origin: center center;
            animation: celestialCounterRevolution var(--stars-orbit-duration, 240s) linear infinite;
        }

        @keyframes celestialCounterRevolution {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(-360deg);
            }
        }

        /* 1. 小幅度、缓慢的上下漂浮层 */
        .star-float-box {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: starSlowFloat 6s ease-in-out infinite alternate;
        }

        @keyframes starSlowFloat {
            0% {
                transform: translateY(-4px);
            }
            100% {
                transform: translateY(4px);
            }
        }

        /* 2. 大尺度的轴向自转层 (自转速度调慢为原先的 0.25 倍左右，88s) */
        .star-galaxy-spinner {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-origin: center center;
            animation: galaxyAxialSpin 88s linear infinite;
        }

        @keyframes galaxyAxialSpin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* 3. 星光微光闪烁与光晕 */
        .star-icon {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: starTwinklePulse 3s ease-in-out infinite alternate;
        }

        .star-icon svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 6px currentColor) drop-shadow(0 0 14px currentColor);
        }

        @keyframes starTwinklePulse {
            0% {
                opacity: 0.65;
                transform: scale(0.92);
                filter: drop-shadow(0 0 4px currentColor);
            }
            100% {
                opacity: 1;
                transform: scale(1.15);
                filter: drop-shadow(0 0 8px currentColor) drop-shadow(0 0 16px currentColor);
            }
        }

        /* 流星着陆生成星星时的动画 (不倾斜，保持正向) */
        .sky-star.star-newborn {
            animation: starBorn 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes starBorn {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0;
            }
            60% {
                transform: translate(-50%, -50%) scale(1.4);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        /* 星辰坍缩化作尘埃消散动画 (速度调慢为现在的 0.25 倍左右，3.2s) */
        .sky-star.star-dissolving {
            pointer-events: none !important;
            animation: starDissolve 3.2s cubic-bezier(0.25, 1, 0.5, 1) forwards !important;
        }

        .sky-star.star-dissolving .star-tooltip {
            display: none !important;
        }

        @keyframes starDissolve {
            0% {
                transform: translate(-50%, -50%) scale(1);
                filter: brightness(1) drop-shadow(0 0 6px currentColor);
                opacity: 1;
            }
            15% {
                transform: translate(-50%, -50%) scale(1.38);
                filter: brightness(2.6) drop-shadow(0 0 22px currentColor);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -75%) scale(0.05);
                filter: brightness(3) blur(10px);
                opacity: 0;
            }
        }

        /* 悬浮提示框：完全正向 0°，文字透明度 75% */
        .star-tooltip {
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%) translateY(4px) rotate(0deg) !important;
            padding: 7px 13px;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 10px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            z-index: 100;
        }

        .star-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 5px;
            border-style: solid;
            border-color: rgba(15, 23, 42, 0.92) transparent transparent transparent;
        }

        .sky-star:hover .star-tooltip {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0) rotate(0deg) !important;
        }

        .star-tooltip-title {
            font-weight: 600;
            font-size: 11px;
            opacity: 0.75; /* 文字透明度 75% */
            margin-bottom: 3px;
        }

        .star-tooltip-text {
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            opacity: 0.75; /* 文字透明度 75% */
            font-size: 12px;
            color: #f1f5f9;
        }

        /* 动画特效层 (流星与火花) */
        #effectContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 50;
            overflow: hidden;
        }

        .shooting-meteor {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 16px 4px #38bdf8, 0 0 32px 8px #a5f3fc;
            pointer-events: none;
            transform-origin: center center;
        }

        .shooting-meteor-tail {
            position: absolute;
            top: 50%;
            right: 2px;
            transform: translateY(-50%);
            width: 180px;
            height: 3px;
            background: linear-gradient(to left, #ffffff 10%, #38bdf8 50%, rgba(56, 189, 248, 0) 100%);
            border-radius: 999px;
            filter: drop-shadow(0 0 6px #38bdf8);
        }

        .stardust-spark {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            background: #ffffff;
            animation: sparkFade 0.6s ease-out forwards;
        }

        @keyframes sparkFade {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
        }

        /* 星辰消散尘埃粒子 */
        .cosmic-dust-particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            transform-origin: center center;
            will-change: transform, opacity;
            z-index: 52;
        }

        /* 星辰消散能量光晕 */
        .cosmic-dust-halo {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0.2);
            opacity: 0.85;
            filter: blur(5px);
            will-change: transform, opacity;
            z-index: 51;
        }

        /* 当前对话气泡 (正在进行的对话) */
        .active-dialog-bubble {
            position: fixed;
            right: 36px;
            bottom: 96px;
            width: 440px;
            max-width: calc(100vw - 48px);
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 20px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
            z-index: 20;
            display: flex;
            flex-direction: column;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.9) translateY(20px);
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.3s;
            overflow: hidden;
        }

        .active-dialog-bubble.visible {
            opacity: 1;
            visibility: visible;
            transform: scale(1) translateY(0);
        }

        .active-dialog-bubble.condensing {
            transform: scale(0.05) translate(40px, -40px);
            opacity: 0;
            filter: blur(6px);
            transition: all 0.4s cubic-bezier(0.4, 0, 1, 1);
        }

        .active-bubble-header {
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.03);
            font-size: 13px;
            color: #94a3b8;
        }

        .condense-btn {
            background: rgba(56, 189, 248, 0.18);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #38bdf8;
            border-radius: 12px;
            padding: 3px 10px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .condense-btn:hover {
            background: rgba(56, 189, 248, 0.35);
            border-color: rgba(56, 189, 248, 0.7);
            color: #ffffff;
            transform: translateY(-1px);
        }

        .active-bubble-body {
            padding: 16px;
            max-height: 360px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            user-select: text;
        }

        .active-bubble-body::-webkit-scrollbar {
            width: 5px;
        }
        .active-bubble-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.18);
            border-radius: 4px;
        }

        .bubble-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
            animation: fadeIn 0.25s ease-out;
        }

        .bubble-row.user {
            align-items: flex-end;
        }

        .bubble-row.ai {
            align-items: flex-start;
        }

        .bubble-label {
            font-size: 11px;
            color: #64748b;
            padding: 0 4px;
        }

        .bubble-text {
            max-width: 90%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.55;
            word-break: break-word;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
        }

        .bubble-text.user {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #ffffff;
            border-bottom-right-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .bubble-text.ai {
            background: rgba(30, 41, 59, 0.85);
            color: #f1f5f9;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        /* 倒计时进度条 */
        .bubble-collapse-progress {
            height: 2px;
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            position: relative;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #38bdf8, #a5f3fc);
            transition: width linear;
        }

        /* 历史对话查看弹窗 (点击星星弹出) */
        .history-bubble-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 90;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .history-bubble-overlay.active {
            display: flex;
        }

        .history-bubble-card {
            width: 500px;
            max-width: calc(100vw - 36px);
            max-height: 80vh;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: modalIn 0.25s ease-out;
        }

        .history-card-header {
            padding: 14px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
        }

        .history-card-body {
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            user-select: text;
        }

        .history-card-footer {
            padding: 12px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.02);
        }

        /* 底部居中输入底栏 */
        .bottom-dock {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: 720px;
            max-width: calc(100vw - 32px);
            z-index: 10;
        }

        .input-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 24px;

    <script>
        /**
         * ================================================================
         * 🎨 外观与交互配置接口 (Customization API)
         * ================================================================
         * 供后续快速修改光标样式与发送按键小图标：
         *
         * 1. 更换光标 (支持 default, pointer, text 等)：
         *    window.XingcaiCustomConfig.setCursor({
         *        defaultCursor: "url('path/to/normal.cur'), auto",
         *        pointerCursor: "url('path/to/pointer.cur'), pointer",
         *        textCursor: "url('path/to/text.cur'), text"
         *    });
         *
         * 2. 更换发送键图标图片 (填入图片或 SVG 的 URL 路径)：
         *    window.XingcaiCustomConfig.setSendIconImage("../../myimages/send_icon.svg");
         *
         * 3. 更换发送键内部 HTML (如自定义 SVG 矢量代码或文字)：
         *    window.XingcaiCustomConfig.setSendIconHtml("<svg>...</svg>");
         *
         * 4. 调整发送按键尺寸与圆角 (默认 36px, 8px 圆角)：
         *    window.XingcaiCustomConfig.setSendButtonSize(36, 8);
         * ================================================================
         */
        window.XingcaiCustomConfig = {
            setCursor: function({ defaultCursor, pointerCursor, textCursor }) {
                if (defaultCursor) document.documentElement.style.setProperty('--app-cursor-default', defaultCursor);
                if (pointerCursor) document.documentElement.style.setProperty('--app-cursor-pointer', pointerCursor);
                if (textCursor) document.documentElement.style.setProperty('--app-cursor-text', textCursor);
            },
            setSendIconImage: function(imageUrl) {
                document.documentElement.style.setProperty('--send-btn-icon-image', `url("${imageUrl}")`);
                const svg = document.querySelector('.send-btn-icon svg');
                if (svg) svg.style.display = 'none';
            },
            setSendIconHtml: function(htmlString) {
                const container = document.querySelector('.send-btn-icon');
                if (container) {
                    document.documentElement.style.setProperty('--send-btn-icon-image', 'none');
                    container.innerHTML = htmlString;
                }
            },
            setSendButtonSize: function(sizePx, radiusPx = 8) {
                document.documentElement.style.setProperty('--send-btn-size', `${sizePx}px`);
                document.documentElement.style.setProperty('--send-btn-radius', `${radiusPx}px`);
            },
            setOrbitDuration: function(seconds) {
                document.documentElement.style.setProperty('--stars-orbit-duration', `${seconds}s`);
            },
            setOrbitCenter: function(xPercent, yPercent) {
                document.documentElement.style.setProperty('--stars-orbit-x', `${xPercent}%`);
                document.documentElement.style.setProperty('--stars-orbit-y', `${yPercent}%`);
            }
        };

        // 星辰色彩调色板 (亮色/柔和发光)
        const STAR_PALETTE = [
            { color: '#38bdf8', glow: 'rgba(56, 189, 248, 0.65)' }, // 天空青
            { color: '#facc15', glow: 'rgba(250, 204, 21, 0.65)' }, // 晨曦金
            { color: '#c084fc', glow: 'rgba(192, 132, 252, 0.65)' }, // 星云紫
            { color: '#34d399', glow: 'rgba(52, 211, 153, 0.65)' }, // 翡翠翠
            { color: '#f472b6', glow: 'rgba(244, 114, 182, 0.65)' }, // 樱花粉
            { color: '#67e8f9', glow: 'rgba(103, 232, 249, 0.65)' }  // 极光碧
        ];

        // 状态变量

        // 初始化

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, (m) => {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
            });
        }

        function initSettingsForm() {

            settingModelName.value = window.localLLMClient.modelName;
            settingApiKey.value = window.localLLMClient.apiKey;

        async function checkServerStatus() {
            statusBadge.className = 'status-badge';
            statusText.innerText = '检测服务...';
            const res = await window.localLLMClient.checkHealth();
            if (res.ok) {
                isServerOnline = true;
                statusBadge.className = 'status-badge';
                statusText.innerText = '本地大模型已连接';
            } else {
                isServerOnline = false;
                statusBadge.className = 'status-badge offline';
                statusText.innerText = '演示模式 (本地模型离线)';
            }
        }

        // ==========================================
        // 星辰背景与历史记录管理
        // ==========================================
        function loadStarHistory() {
            try {
                const stored = localStorage.getItem('xingcai_star_history');
                if (stored) {
                    starHistory = JSON.parse(stored);
                    starsContainer.innerHTML = '';
                    starHistory.forEach(item => {
                        const starEl = createStarElement(item);
                        starsContainer.appendChild(starEl);
                    });
                }
            } catch (e) {
                console.warn('加载历史星辰失败:', e);
                starHistory = [];
            }
        }

        // 避开中间 Live2D 人物立绘的安全星空区域
        function getRandomStarPosition() {
            const zones = [
                { minX: 6, maxX: 30, minY: 14, maxY: 82 },   // 左侧夜空
                { minX: 70, maxX: 94, minY: 14, maxY: 82 },  // 右侧夜空
                { minX: 32, maxX: 68, minY: 12, maxY: 24 }   // 顶部夜空
            ];
            const r = Math.random();
            const zone = r < 0.45 ? zones[0] : (r < 0.90 ? zones[1] : zones[2]);
            const x = Math.round(zone.minX + Math.random() * (zone.maxX - zone.minX));
            const y = Math.round(zone.minY + Math.random() * (zone.maxY - zone.minY));
            return { x, y };
        }

        function createStarElement(starData) {
            const el = document.createElement('div');
            el.className = 'sky-star';
            el.id = `star-${starData.id}`;
            el.style.left = `${starData.x}%`;
            el.style.top = `${starData.y}%`;
            el.style.color = starData.color.color;

            // 缓慢漂浮参数 (小幅度上下漂浮 5~8.5s)
            const floatDuration = (5.5 + Math.random() * 3).toFixed(1);
            const floatDelay = (Math.random() * 4).toFixed(1);

            // 星系大尺度轴向自转参数 (调慢至约 0.25 倍速，72~120s)
            const spinDuration = ((18 + Math.random() * 12) * 4).toFixed(1);
            const spinDirection = Math.random() > 0.5 ? 'normal' : 'reverse';

            // 星光闪烁脉动参数
            const twinkleDuration = (2.5 + Math.random() * 2).toFixed(1);
            const twinkleDelay = (Math.random() * 3).toFixed(1);

            const shortText = (starData.userText || '').substring(0, 18);

            el.innerHTML = `
                <div class="star-counter-orbit">
                    <div class="star-float-box" style="animation-duration:${floatDuration}s; animation-delay:${floatDelay}s;">
                        <div class="star-galaxy-spinner" style="animation-duration:${spinDuration}s; animation-direction:${spinDirection};">
                            <div class="star-icon" style="animation-duration:${twinkleDuration}s; animation-delay:${twinkleDelay}s;">
                                <svg viewBox="0 0 24 24">
                                    <path d="M12 0 L14.8 9.2 L24 12 L14.8 14.8 L12 24 L9.2 14.8 L0 12 L9.2 9.2 Z" fill="currentColor" />
                                </svg>
                            </div>
                        </div>
                    </div>
                    <div class="star-tooltip">
                        <div class="star-tooltip-title">✨ 记忆星芒</div>
                        <div class="star-tooltip-text">${escapeHtml(shortText)}</div>
                    </div>
                </div>
            `;

            // 同步公转逆向补偿时间轴，使无论何时新增星辰，提示框与星辰本体都绝对正向
            const orbitDuration = 240;
            const elapsed = (performance.now() / 1000) % orbitDuration;
            const counterOrbitEl = el.querySelector('.star-counter-orbit');
            if (counterOrbitEl) {
                counterOrbitEl.style.animationDelay = `-${elapsed.toFixed(3)}s`;
            }

            el.addEventListener('click', (e) => {
                e.stopPropagation();
                openHistoryBubble(starData);
            });

            return el;
        }

        // ==========================================
        // 星辰化作尘埃消散特效 (消散速度调慢为原先的 0.25 倍左右，3.2s)
        // ==========================================
        function disintegrateStar(starEl, colorObj, onComplete) {
            if (!starEl) {
                if (onComplete) onComplete();
                return;
            }

            const rect = starEl.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            // 1. 触发星星主体能量耀斑与缓慢坍缩消散
            starEl.classList.add('star-dissolving');

            // 2. 释放弥漫的宇宙尘埃微粒云与慢速扩散光环
            const baseColor = (colorObj && colorObj.color) || starEl.style.color || '#38bdf8';
            const glowColor = (colorObj && colorObj.glow) || 'rgba(56, 189, 248, 0.6)';
            spawnCosmicDustCloud(centerX, centerY, baseColor, glowColor);

            // 3. 动画结束后安全清理 DOM (3200ms)
            setTimeout(() => {
                if (starEl.parentNode) {
                    starEl.remove();
                }
                if (onComplete) onComplete();
            }, 3200);
        }

        function spawnCosmicDustCloud(centerX, centerY, baseColor, glowColor) {
            // 弥散的宇宙微波微型光晕 (慢速外溢膨胀，约 2.6s~3.4s)
            for (let h = 0; h < 2; h++) {
                const halo = document.createElement('div');
                halo.className = 'cosmic-dust-halo';
                halo.style.left = `${centerX}px`;
                halo.style.top = `${centerY}px`;
                halo.style.width = `${24 + h * 16}px`;
                halo.style.height = `${24 + h * 16}px`;
                halo.style.background = `radial-gradient(circle, ${baseColor} 0%, ${glowColor} 50%, transparent 75%)`;
                effectContainer.appendChild(halo);

                const haloAnim = halo.animate([
                    { transform: 'translate(-50%, -50%) scale(0.25)', opacity: 0.9 },
                    { transform: 'translate(-50%, -50%) scale(2.6)', opacity: 0 }
                ], {
                    duration: (650 + h * 180) * 4,
                    easing: 'cubic-bezier(0.18, 0.89, 0.32, 1.15)',
                    fill: 'forwards'
                });
                haloAnim.onfinish = () => halo.remove();
            }

            // 细腻微光尘埃粒子 (18 ~ 26 颗极度轻盈升腾飘散，持续 3.2s ~ 5.0s)
            const particleCount = 18 + Math.floor(Math.random() * 8);
            for (let i = 0; i < particleCount; i++) {
                const dust = document.createElement('div');
                dust.className = 'cosmic-dust-particle';

                // 细小尘埃尺寸 (1.4px ~ 3.8px)
                const size = (1.4 + Math.random() * 2.4).toFixed(1);
                dust.style.width = `${size}px`;
                dust.style.height = `${size}px`;

                // 颜色混配：白金微光与星辰主题辉光相间
                const isWhite = Math.random() > 0.5;
                const pColor = isWhite ? '#ffffff' : baseColor;
                dust.style.backgroundColor = pColor;
                dust.style.boxShadow = isWhite
                    ? '0 0 5px #ffffff, 0 0 10px rgba(255, 255, 255, 0.8)'
                    : `0 0 6px ${baseColor}, 0 0 12px ${glowColor}`;

                dust.style.left = `${centerX}px`;
                dust.style.top = `${centerY}px`;
                effectContainer.appendChild(dust);

                // 物理飘散轨迹：向四方初散后，受微引力极缓升腾并侧滑
                const angle = Math.random() * Math.PI * 2;
                const speed = 28 + Math.random() * 64; // 径向飞散距离
                const upwardLift = -(26 + Math.random() * 46); // 升腾漂浮位移
                const driftX = (Math.random() - 0.5) * 34; // 水平侧滑漂动

                const midX = Math.cos(angle) * (speed * 0.5) + driftX * 0.35;
                const midY = Math.sin(angle) * (speed * 0.5) + upwardLift * 0.35;
                const endX = Math.cos(angle) * speed + driftX;
                const endY = Math.sin(angle) * speed + upwardLift;

                const duration = (800 + Math.random() * 450) * 4; // 3200ms ~ 5000ms
                const delay = Math.random() * 180;

                const anim = dust.animate([
                    {
                        transform: 'translate(-50%, -50%) translate(0, 0) scale(0.3)',
                        opacity: 0
                    },
                    {
                        transform: `translate(-50%, -50%) translate(${midX}px, ${midY}px) scale(1.3)`,
                        opacity: 1,
                        offset: 0.16
                    },
                    {
                        transform: `translate(-50%, -50%) translate(${midX + (endX - midX) * 0.5}px, ${midY + (endY - midY) * 0.5}px) scale(0.95)`,
                        opacity: 0.75,
                        offset: 0.65
                    },
                    {
                        transform: `translate(-50%, -50%) translate(${endX}px, ${endY}px) scale(0)`,
                        opacity: 0,
                        offset: 1
                    }
                ], {
                    duration: duration,
                    delay: delay,
                    easing: 'cubic-bezier(0.12, 0.8, 0.32, 1)',
                    fill: 'forwards'
                });

                anim.onfinish = () => dust.remove();
            }
        }

        function deleteStar(id) {
            const starEl = document.getElementById(`star-${id}`);
            const starData = starHistory.find(s => String(s.id) === String(id));
            const colorObj = starData ? starData.color : null;

            if (starEl) {
                disintegrateStar(starEl, colorObj);
            }
            starHistory = starHistory.filter(s => String(s.id) !== String(id));
            localStorage.setItem('xingcai_star_history', JSON.stringify(starHistory));
        }

        let isClearingStars = false;

        clearChatBtn.addEventListener('click', () => {
            if (isClearingStars) return;
            if (starHistory.length === 0 && !currentActiveDialogue) return;
            if (!confirm('确定要清理夜空中的所有对话星辰吗？')) return;

            isClearingStars = true;
            clearChatBtn.style.opacity = '0.5';
            clearChatBtn.style.pointerEvents = 'none';

            // 1. 若当前有尚未缩成星星的对话气泡，同样化作柔和尘埃消散
            if (currentActiveDialogue) {
                clearCollapseCountdown();
                const bubble = activeDialogBubble;
                const rect = bubble.getBoundingClientRect();
                const bx = rect.left + rect.width / 2;
                const by = rect.top + rect.height / 2;
                spawnCosmicDustCloud(bx, by, '#38bdf8', 'rgba(56, 189, 248, 0.6)');
                bubble.classList.remove('visible', 'condensing');
                currentActiveDialogue = null;
            }

            const starElements = Array.from(starsContainer.querySelectorAll('.sky-star'));
            const totalStars = starElements.length;

            if (totalStars === 0) {
                finishClear();
                return;
            }

            // 2. 波浪涟漪式群星依次解构化作尘埃消散 (错峰启动)
            let finishedCount = 0;
            starElements.forEach((starEl, index) => {
                const delay = Math.min(index * 120, 1200) + Math.random() * 40;
                setTimeout(() => {
                    const id = starEl.id ? starEl.id.replace('star-', '') : null;
                    const starData = starHistory.find(s => String(s.id) === String(id));
                    const colorObj = starData ? starData.color : null;

                    disintegrateStar(starEl, colorObj, () => {
                        finishedCount++;
                        if (finishedCount >= totalStars) {
                            finishClear();
                        }
                    });
                }, delay);
            });

            function finishClear() {
                starsContainer.innerHTML = '';
                starHistory = [];
                localStorage.removeItem('xingcai_star_history');
                isClearingStars = false;
                clearChatBtn.style.opacity = '';
                clearChatBtn.style.pointerEvents = '';
            }
        });

        // ==========================================
        // 流星划过与粒子特效
        // ==========================================
        function shootMeteor(fromX, fromY, toX, toY, colorObj, onComplete) {
            const meteor = document.createElement('div');
            meteor.className = 'shooting-meteor';
            meteor.style.left = `${fromX}px`;
            meteor.style.top = `${fromY}px`;
            meteor.style.backgroundColor = '#ffffff';
            meteor.style.boxShadow = `0 0 16px 4px ${colorObj.color}, 0 0 32px 8px ${colorObj.glow}`;

            const tail = document.createElement('div');
            tail.className = 'shooting-meteor-tail';
            tail.style.background = `linear-gradient(to left, #ffffff 10%, ${colorObj.color} 50%, rgba(0,0,0,0) 100%)`;
            tail.style.filter = `drop-shadow(0 0 6px ${colorObj.color})`;
            meteor.appendChild(tail);

            effectContainer.appendChild(meteor);

            const deltaX = toX - fromX;
            const deltaY = toY - fromY;
            const angleDeg = Math.atan2(deltaY, deltaX) * (180 / Math.PI);

            const anim = meteor.animate([
                { transform: `translate(0px, 0px) rotate(${angleDeg}deg) scale(0.2)`, opacity: 0 },
                { transform: `translate(${deltaX * 0.15}px, ${deltaY * 0.15}px) rotate(${angleDeg}deg) scale(1)`, opacity: 1, offset: 0.15 },
                { transform: `translate(${deltaX * 0.9}px, ${deltaY * 0.9}px) rotate(${angleDeg}deg) scale(0.85)`, opacity: 1, offset: 0.9 },
                { transform: `translate(${deltaX}px, ${deltaY}px) rotate(${angleDeg}deg) scale(0.1)`, opacity: 0, offset: 1 }
            ], {
                duration: 750,
                easing: 'cubic-bezier(0.22, 0.61, 0.36, 1)'
            });

            anim.onfinish = () => {
                meteor.remove();
                spawnStardustBurst(toX, toY, colorObj.color);
                if (onComplete) onComplete();
            };
        }

        function spawnStardustBurst(x, y, color) {
            const particleCount = 8;
            for (let i = 0; i < particleCount; i++) {
                const p = document.createElement('div');
                p.className = 'stardust-spark';
                const angle = (i / particleCount) * Math.PI * 2 + (Math.random() * 0.5);
                const dist = 18 + Math.random() * 24;
                const dx = Math.cos(angle) * dist;
                const dy = Math.sin(angle) * dist;
                const size = 3 + Math.random() * 3;

                p.style.left = `${x}px`;
                p.style.top = `${y}px`;
                p.style.width = `${size}px`;
                p.style.height = `${size}px`;
                p.style.backgroundColor = color;
                p.style.boxShadow = `0 0 8px ${color}`;
                p.style.setProperty('--dx', `${dx}px`);
                p.style.setProperty('--dy', `${dy}px`);
                effectContainer.appendChild(p);

                setTimeout(() => p.remove(), 600);
            }
        }

        // ==========================================
        // 当前对话气泡管理与流星收纳
        // ==========================================
        function startCollapseCountdown() {
            clearCollapseCountdown();
            countdownRemaining = 4000;
            runCountdownStep();
        }

        function runCountdownStep() {
            countdownStartTime = Date.now();
            countdownTimer = setTimeout(() => {
                condenseCurrentBubble();
            }, countdownRemaining);
            collapseProgressBar.style.transition = `width ${countdownRemaining}ms linear`;
            collapseProgressBar.style.width = '100%';
        }

        function pauseCollapseCountdown() {
            if (countdownTimer && !isBubbleHovered) {
                isBubbleHovered = true;
                clearTimeout(countdownTimer);
                countdownTimer = null;
                const elapsed = Date.now() - countdownStartTime;
                countdownRemaining = Math.max(0, countdownRemaining - elapsed);
                const computedWidth = collapseProgressBar.getBoundingClientRect().width;
                const parentWidth = collapseProgressBar.parentElement.getBoundingClientRect().width;
                const pct = parentWidth > 0 ? (computedWidth / parentWidth) * 100 : 0;
                collapseProgressBar.style.transition = 'none';
                collapseProgressBar.style.width = `${pct}%`;
            }
        }

        function resumeCollapseCountdown() {
            if (isBubbleHovered && currentActiveDialogue) {
                isBubbleHovered = false;
                if (countdownRemaining > 150) {
                    runCountdownStep();
                } else {
                    condenseCurrentBubble();
                }
            }
        }

        function clearCollapseCountdown() {
            if (countdownTimer) {
                clearTimeout(countdownTimer);
                countdownTimer = null;
            }
            isBubbleHovered = false;
            collapseProgressBar.style.transition = 'none';
            collapseProgressBar.style.width = '0%';
        }

        activeDialogBubble.addEventListener('mouseenter', pauseCollapseCountdown);
        activeDialogBubble.addEventListener('mouseleave', resumeCollapseCountdown);
        condenseStarBtn.addEventListener('click', () => {
            condenseCurrentBubble();
        });

        // 计算星空公转容器在当前旋转矩阵下，星辰坐标 (pctX%, pctY%) 在视口中的真实像素位置
        function getRotatedScreenPos(pctX, pctY) {
            const centerX = window.innerWidth * 0.5;
            const centerY = window.innerHeight * 0.8;
            const origX = (pctX / 100) * window.innerWidth;
            const origY = (pctY / 100) * window.innerHeight;

            const transform = window.getComputedStyle(starsContainer).transform;
            if (transform && transform !== 'none') {
                const match2d = transform.match(/^matrix\(([^)]+)\)$/);
                if (match2d) {
                    const [a, b] = match2d[1].split(',').map(Number);
                    const dx = origX - centerX;
                    const dy = origY - centerY;
                    return {
                        x: centerX + (dx * a - dy * b),
                        y: centerY + (dx * b + dy * a)
                    };
                }
                const match3d = transform.match(/^matrix3d\(([^)]+)\)$/);
                if (match3d) {
                    const parts = match3d[1].split(',').map(Number);
                    const a = parts[0];
                    const b = parts[1];
                    const dx = origX - centerX;
                    const dy = origY - centerY;
                    return {
                        x: centerX + (dx * a - dy * b),
                        y: centerY + (dx * b + dy * a)
                    };
                }
            }
            return { x: origX, y: origY };
        }

        function condenseCurrentBubble() {
            if (!currentActiveDialogue) return;
            clearCollapseCountdown();

            const bubble = activeDialogBubble;
            const rect = bubble.getBoundingClientRect();
            const fromX = rect.left + rect.width / 2;
            const fromY = rect.top + rect.height / 2;

            const pos = getRandomStarPosition();
            const target = getRotatedScreenPos(pos.x, pos.y);
            const toX = target.x;
            const toY = target.y;
            const colorObj = STAR_PALETTE[Math.floor(Math.random() * STAR_PALETTE.length)];

            const starData = {
                id: currentActiveDialogue.id,
                userText: currentActiveDialogue.userText,
                aiText: currentActiveDialogue.aiText,
                time: currentActiveDialogue.time,
                x: pos.x,
                y: pos.y,
                color: colorObj
            };

            currentActiveDialogue = null;
            bubble.classList.add('condensing');

            shootMeteor(fromX, fromY, toX, toY, colorObj, () => {
                const starEl = createStarElement(starData);
                starEl.classList.add('star-newborn');
                starsContainer.appendChild(starEl);
                setTimeout(() => {
                    starEl.classList.remove('star-newborn');
                }, 600);

                starHistory.push(starData);
                localStorage.setItem('xingcai_star_history', JSON.stringify(starHistory));

                bubble.classList.remove('visible', 'condensing');
            });
        }

        // ==========================================
        // 历史对话查看弹窗
        // ==========================================
        function openHistoryBubble(starData) {
            historyModalTitle.innerHTML = `<span style="color:${starData.color.color};">✦</span> 对话星辰 · <span style="font-size:12px;color:#94a3b8;font-weight:normal;">${starData.time || ''}</span>`;
            historyUserMsg.innerText = starData.userText;
            historyAiMsg.innerHTML = formatActionTags(starData.aiText);

            historyReplayBtn.onclick = () => {
                window.live2dMotionEngine.setSpeaking(true);
                const matches = starData.aiText.match(/\[(点头|摇头|歪头|害羞|脸红|眨眼|卖萌|微笑|开心|思考|沉思|惊讶|吃惊|换衣服|外套|脱外套|穿外套|裙子1|裙子2|nod|shake|tilt|blush|wink|smile|think|surprise|jacket|skirt1|skirt2)\]/gi);
                if (matches) {
                    matches.forEach(t => window.live2dMotionEngine.triggerAction(t.replace(/[\[\]]/g, '')));
                }
                setTimeout(() => window.live2dMotionEngine.setSpeaking(false), 3000);
            };

            historyDeleteBtn.onclick = () => {

        function closeHistoryBubble() {
            historyBubbleModal.classList.remove('active');
        }

        closeHistoryModalBtn.addEventListener('click', closeHistoryBubble);
        closeHistoryModalConfirmBtn.addEventListener('click', closeHistoryBubble);
        historyBubbleModal.addEventListener('click', (e) => {
            if (e.target === historyBubbleModal) {
                closeHistoryBubble();
            }
        });

        });

        // ==========================================
        // 消息发送与流式响应逻辑
        // ==========================================
        function formatActionTags(rawText) {
            return rawText.replace(/\[(点头|摇头|歪头|害羞|脸红|眨眼|卖萌|微笑|开心|思考|沉思|惊讶|吃惊|换衣服|外套|脱外套|穿外套|裙子1|裙子2|nod|shake|tilt|blush|wink|smile|think|surprise|jacket|skirt1|skirt2)\]/gi, (match) => {
                return `<span class="action-tag">🏷️ ${match.replace(/[\[\]]/g, '')}</span>`;
            });
        }

        async function handleSend() {
            const text = chatInput.value.trim();
            if (!text || isGenerating) return;

            // 如果上一段对话还在气泡等待倒计时，立刻收为流星
            if (currentActiveDialogue) {
                condenseCurrentBubble();
            }

            chatInput.value = '';
            isGenerating = true;
            sendBtn.disabled = true;

            // 显示当前活跃气泡
            activeBubbleTitle.innerText = '✨ 交流中...';
            activeUserText.innerText = text;
            activeAiText.innerHTML = '<span class="cursor-blink"></span>';
            clearCollapseCountdown();
            activeDialogBubble.classList.remove('condensing');
            activeDialogBubble.classList.add('visible');

            chatHistory.push({ role: 'user', content: text });

            // 角色状态：思考中
            statusBadge.className = 'status-badge speaking';
            statusText.innerText = '星彩正在思考...';
            window.live2dMotionEngine.think(2.0);

            if (isServerOnline) {
                await sendToLocalLLM();
            } else {
                await sendToMockEngine(text);
            }

            isGenerating = false;
            sendBtn.disabled = false;
            if (isServerOnline) {
                statusBadge.className = 'status-badge';
                statusText.innerText = '本地大模型已连接';
            } else {
                statusBadge.className = 'status-badge offline';
                statusText.innerText = '演示模式 (本地模型离线)';
            }
            window.live2dMotionEngine.setSpeaking(false);
        }

        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });
        sendBtn.addEventListener('click', handleSend);

        async function sendToLocalLLM() {
            let fullContent = '';
            let parsedTags = new Set();
            window.live2dMotionEngine.setSpeaking(true);
            statusText.innerText = '星彩正在回复...';

            await new Promise((resolve) => {
                window.localLLMClient.chatStream(
                    chatHistory,
                    (chunk) => {
                        fullContent += chunk;
                        const matches = fullContent.match(/\[(点头|摇头|歪头|害羞|脸红|眨眼|卖萌|微笑|开心|思考|沉思|惊讶|吃惊|换衣服|外套|脱外套|穿外套|裙子1|裙子2|nod|shake|tilt|blush|wink|smile|think|surprise|jacket|skirt1|skirt2)\]/gi);
                        if (matches) {
                            for (const tag of matches) {
                                const clean = tag.replace(/[\[\]]/g, '').toLowerCase();
                                if (!parsedTags.has(clean)) {
                                    parsedTags.add(clean);
                                    window.live2dMotionEngine.triggerAction(clean);
                                }
                            }
                        }
                        activeAiText.innerHTML = formatActionTags(fullContent) + '<span class="cursor-blink"></span>';
                    },
                    () => {
                        activeAiText.innerHTML = formatActionTags(fullContent);
                        chatHistory.push({ role: 'assistant', content: fullContent });
                        onDialogueComplete(chatHistory[chatHistory.length - 2].content, fullContent);
                        resolve();
                    },
                    (err) => {
                        console.warn('本地大模型流式传输中断，切换为演示应答:', err);
                        const fallback = window.localLLMClient.getMockResponse(chatHistory[chatHistory.length - 1].content);
                        typewriterOutput(fallback, resolve);
                    }
                );
            });
        }

        async function sendToMockEngine(userText) {
            const mockReply = window.localLLMClient.getMockResponse(userText);
            await new Promise((resolve) => {
                typewriterOutput(mockReply, resolve);
            });
        }

        function typewriterOutput(fullText, onFinished) {
            let index = 0;
            let currentText = '';
            let parsedTags = new Set();
            window.live2dMotionEngine.setSpeaking(true);
            statusText.innerText = '星彩正在回复...';

            const timer = setInterval(() => {
                if (index < fullText.length) {
                    currentText += fullText[index];
                    index++;

                    const matches = currentText.match(/\[(点头|摇头|歪头|害羞|脸红|眨眼|卖萌|微笑|开心|思考|沉思|惊讶|吃惊|换衣服|外套|脱外套|穿外套|裙子1|裙子2|nod|shake|tilt|blush|wink|smile|think|surprise|jacket|skirt1|skirt2)\]/gi);
                    if (matches) {
                        for (const tag of matches) {
                            const clean = tag.replace(/[\[\]]/g, '').toLowerCase();
                            if (!parsedTags.has(clean)) {
                                parsedTags.add(clean);
                                window.live2dMotionEngine.triggerAction(clean);
                            }
                        }
                    }

                    activeAiText.innerHTML = formatActionTags(currentText) + '<span class="cursor-blink"></span>';
                } else {
                    clearInterval(timer);
                    activeAiText.innerHTML = formatActionTags(fullText);
                    chatHistory.push({ role: 'assistant', content: fullText });
                    onDialogueComplete(chatHistory[chatHistory.length - 2].content, fullText);
                    onFinished();
                }
            }, 38);
        }

        function onDialogueComplete(userText, aiText) {
            activeBubbleTitle.innerText = '✨ 对话完成';
            currentActiveDialogue = {
                id: Date.now(),
                userText: userText,
                aiText: aiText,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };
            startCollapseCountdown();
        }

        // ==========================================
        // 模型设置 Drawer 交互
        // ==========================================
        openSettingsBtn.addEventListener('click', () => {
            initSettingsForm();
            testConnResult.innerText = '';
            settingsDrawer.classList.add('active');
        });
        closeSettingsBtn.addEventListener('click', () => {
            settingsDrawer.classList.remove('active');
        });

        testConnectionBtn.addEventListener('click', async () => {
            testConnResult.style.color = '#38bdf8';
            testConnResult.innerText = '正在测试...';
            window.localLLMClient.saveSettings({
                baseUrl: settingBaseUrl.value,
                modelName: settingModelName.value,
                apiKey: settingApiKey.value
            });
            const res = await window.localLLMClient.checkHealth();
            if (res.ok) {
                testConnResult.style.color = '#34d399';
                testConnResult.innerText = '✅ 连接成功！检测到服务运行中';
                checkServerStatus();
            } else {
                testConnResult.style.color = '#f87171';
                testConnResult.innerText = '❌ 连接失败: ' + res.error;
            }
        });

        saveSettingsBtn.addEventListener('click', async () => {
            window.localLLMClient.saveSettings({
                baseUrl: settingBaseUrl.value,
                modelName: settingModelName.value,
                apiKey: settingApiKey.value,
                systemPrompt: settingSystemPrompt.value
            });
            settingsDrawer.classList.remove('active');
            await checkServerStatus();
        });

        resetSettingsBtn.addEventListener('click', () => {
            localStorage.removeItem('llm_base_url');
            localStorage.removeItem('llm_model_name');
            localStorage.removeItem('llm_api_key');
            localStorage.removeItem('llm_system_prompt');
            window.localLLMClient.loadSettings();
            initSettingsForm();
            testConnResult.innerText = '已恢复默认设置';
        });
    </script>
</body>
</html>
