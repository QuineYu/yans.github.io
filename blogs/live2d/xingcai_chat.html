<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星彩 Live2D - AI 版</title>
    <style>
        /* ==========================================================================
           🎨 外观与交互定制接口 (Customization Interface)
           后续修改光标、发送按钮小图标等配置，可直接调整此处的 CSS 变量或在 JS 中调用
           ========================================================================== */
        :root {
            /* 1. 光标样式接口 (Custom Cursors)
             * 更换光标示例:
             *   --app-cursor-default: url('../../assets/normal.cur'), auto;
             *   --app-cursor-pointer: url('../../assets/pointer.cur'), pointer;
             *   --app-cursor-text: url('../../assets/text.cur'), text;
             */
            --app-cursor-default: default;
            --app-cursor-pointer: pointer;
            --app-cursor-text: text;

            /* 2. 发送按键定制接口 (Send Button Interface)
             * - 尺寸与圆角 (小方块设计):
             *   --send-btn-size: 方块边长 (默认 36px)
             *   --send-btn-radius: 圆角 (默认 8px，0px为硬朗纯方块)
             * - 颜色与图标:
             *   --send-btn-bg: 背景颜色/渐变
             *   --send-btn-hover-bg: 鼠标悬浮背景
             *   --send-btn-color: 图标/文字颜色
             *   --send-btn-icon-image: 自定义图标背景图 (若后续更换为图片/SVG文件，填入如 url('icon.svg'))
             */
            --send-btn-size: 36px;
            --send-btn-radius: 8px;
            --send-btn-bg: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            --send-btn-hover-bg: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            --send-btn-color: #ffffff;
            --send-btn-icon-image: none; /* 例: url('../../myimages/send_icon.svg') */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #f0f4f8;
            background-color: #0d1117;
            cursor: var(--app-cursor-default);
        }

        /* 全屏背景图片 */
        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('../../myimages/background.jpg');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            z-index: 0;
        }

        /* 优雅暗色遮罩，提升文字对比度 */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, rgba(10, 15, 29, 0.25) 0%, rgba(5, 8, 16, 0.65) 100%);
            z-index: 0;
            pointer-events: none;
        }

        /* Live2D WebGL 画布全屏居中 */
        canvas {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 1 !important;
            display: block !important;
            pointer-events: auto !important;
        }

        /* 顶部导航栏 (无底框悬浮设计，去除遮挡) */
        .top-navbar {
            position: fixed;
            top: 18px;
            left: 20px;
            right: 20px;
            height: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            pointer-events: none;
            z-index: 10;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 12px;
            pointer-events: auto;
        }

        /* 返回键：精巧小方块设计，只显示返回符号 */
        .back-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: #f1f5f9;
            font-size: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            cursor: var(--app-cursor-pointer);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(56, 189, 248, 0.45);
            color: #38bdf8;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: auto;
        }

        .nav-btn {
            padding: 7px 14px;
            border-radius: 10px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: #f1f5f9;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: var(--app-cursor-pointer);
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(56, 189, 248, 0.45);
            color: #38bdf8;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
        }

        /* 动作徽章 */
        .action-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 7px;
            margin: 2px 3px;
            border-radius: 6px;
            font-size: 12px;
            background: rgba(56, 189, 248, 0.2);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #38bdf8;
            font-weight: 500;
        }

        /* 打字机光标 */
        .cursor-blink {
            display: inline-block;
            width: 6px;
            height: 14px;
            background-color: #38bdf8;
            vertical-align: middle;
            margin-left: 2px;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* 背景星空容器 (固定全屏容器，星辰各自沿精算椭圆轨道顺时针公转) */
        #starsContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 5;
        }

        .sky-star {
            position: fixed;
            top: 0;
            left: 0;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: var(--app-cursor-pointer);
            pointer-events: auto;
            z-index: 6;
            will-change: transform;
        }

        .sky-star:hover {
            z-index: 10;
        }

        /* 星星本体缩放层 (与外层平移坐标解耦，确保悬停缩放与椭圆运转互不干扰) */
        .star-body {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .sky-star:hover .star-body {
            transform: scale(1.45);
        }

        /* 1. 小幅度、缓慢的上下漂浮层 */
        .star-float-box {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: starSlowFloat 6s ease-in-out infinite alternate;
        }

        @keyframes starSlowFloat {
            0% {
                transform: translateY(-4px);
            }
            100% {
                transform: translateY(4px);
            }
        }

        /* 2. 大尺度的轴向自转层 (自转速度调慢为原先的 0.25 倍左右，88s) */
        .star-galaxy-spinner {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-origin: center center;
            animation: galaxyAxialSpin 88s linear infinite;
        }

        @keyframes galaxyAxialSpin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* 3. 星光微光闪烁与光晕 */
        .star-icon {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: starTwinklePulse 3s ease-in-out infinite alternate;
        }

        .star-icon svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 6px currentColor) drop-shadow(0 0 14px currentColor);
        }

        @keyframes starTwinklePulse {
            0% {
                opacity: 0.65;
                transform: scale(0.92);
                filter: drop-shadow(0 0 4px currentColor);
            }
            100% {
                opacity: 1;
                transform: scale(1.15);
                filter: drop-shadow(0 0 8px currentColor) drop-shadow(0 0 16px currentColor);
            }
        }

        /* 流星着陆生成星星时的动画 (不倾斜，保持正向) */
        .sky-star.star-newborn {
            animation: starBorn 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes starBorn {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0;
            }
            60% {
                transform: translate(-50%, -50%) scale(1.4);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        /* 星辰坍缩化作尘埃消散动画 (速度调慢为现在的 0.25 倍左右，3.2s) */
        .sky-star.star-dissolving {
            pointer-events: none !important;
            animation: starDissolve 3.2s cubic-bezier(0.25, 1, 0.5, 1) forwards !important;
        }

        .sky-star.star-dissolving .star-tooltip {
            display: none !important;
        }

        @keyframes starDissolve {
            0% {
                transform: translate(-50%, -50%) scale(1);
                filter: brightness(1) drop-shadow(0 0 6px currentColor);
                opacity: 1;
            }
            15% {
                transform: translate(-50%, -50%) scale(1.38);
                filter: brightness(2.6) drop-shadow(0 0 22px currentColor);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -75%) scale(0.05);
                filter: brightness(3) blur(10px);
                opacity: 0;
            }
        }

        /* 悬浮提示框：完全正向 0°，文字透明度 75% */
        .star-tooltip {
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%) translateY(4px) rotate(0deg) !important;
            padding: 7px 13px;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 10px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            z-index: 100;
        }

        .star-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 5px;
            border-style: solid;
            border-color: rgba(15, 23, 42, 0.92) transparent transparent transparent;
        }

        .sky-star:hover .star-tooltip {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0) rotate(0deg) !important;
        }

        .star-tooltip-title {
            font-weight: 600;
            font-size: 11px;
            opacity: 0.75; /* 文字透明度 75% */
            margin-bottom: 3px;
        }

        .star-tooltip-text {
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            opacity: 0.75; /* 文字透明度 75% */
            font-size: 12px;
            color: #f1f5f9;
        }

        /* 动画特效层 (流星与火花) */
        #effectContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 50;
            overflow: hidden;
        }

        .shooting-meteor {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 16px 4px #38bdf8, 0 0 32px 8px #a5f3fc;
            pointer-events: none;
            transform-origin: center center;
        }

        .shooting-meteor-tail {
            position: absolute;
            top: 50%;
            right: 2px;
            transform: translateY(-50%);
            width: 180px;
            height: 3px;
            background: linear-gradient(to left, #ffffff 10%, #38bdf8 50%, rgba(56, 189, 248, 0) 100%);
            border-radius: 999px;
            filter: drop-shadow(0 0 6px #38bdf8);
        }

        .stardust-spark {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            background: #ffffff;
            animation: sparkFade 0.6s ease-out forwards;
        }

        @keyframes sparkFade {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
        }

        /* 星辰消散尘埃粒子 */
        .cosmic-dust-particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            transform-origin: center center;
            will-change: transform, opacity;
            z-index: 52;
        }

        /* 星辰消散能量光晕 */
        .cosmic-dust-halo {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0.2);
            opacity: 0.85;
            filter: blur(5px);
            will-change: transform, opacity;
            z-index: 51;
        }

        /* 当前对话气泡 (正在进行的对话) */
        .active-dialog-bubble {
            position: fixed;
            right: 36px;
            bottom: 96px;
            width: 440px;
            max-width: calc(100vw - 48px);
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 20px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
            z-index: 20;
            display: flex;
            flex-direction: column;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.9) translateY(20px);
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.3s;
            overflow: hidden;
        }

        .active-dialog-bubble.visible {
            opacity: 1;
            visibility: visible;
            transform: scale(1) translateY(0);
        }

        .active-dialog-bubble.condensing {
            transform: scale(0.05) translate(40px, -40px);
            opacity: 0;
            filter: blur(6px);
            transition: all 0.4s cubic-bezier(0.4, 0, 1, 1);
        }

        .active-bubble-header {
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.03);
            font-size: 13px;
            color: #94a3b8;
        }

        .condense-btn {
            background: rgba(56, 189, 248, 0.18);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #38bdf8;
            border-radius: 12px;
            padding: 4px 11px;
            font-size: 12px;
            cursor: var(--app-cursor-pointer);
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .condense-btn:hover:not(:disabled) {
            background: rgba(56, 189, 248, 0.35);
            border-color: rgba(56, 189, 248, 0.7);
            color: #ffffff;
            transform: translateY(-1px);
        }

        .condense-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .bubble-close-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 18px;
            line-height: 1;
            padding: 2px 7px;
            cursor: var(--app-cursor-pointer);
            border-radius: 6px;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .bubble-close-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.12);
        }

        /* 凝成星芒后置于对话流中的徽章标记 */
        .star-condensed-badge {
            align-self: center;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 6px 14px;
            margin: 6px 0;
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(56, 189, 248, 0.45);
            border-radius: 20px;
            font-size: 12px;
            color: #f1f5f9;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.35s ease-out;
            cursor: var(--app-cursor-pointer);
            transition: all 0.2s ease;
            max-width: 92%;
            text-align: center;
        }

        .star-condensed-badge:hover {
            transform: translateY(-1px);
            border-color: rgba(56, 189, 248, 0.8);
            background: rgba(30, 41, 59, 0.95);
        }

        .star-condensed-badge .star-badge-icon {
            font-size: 13px;
        }

        .star-condensed-badge .star-badge-text {
            font-weight: 500;
            letter-spacing: 0.2px;
        }

        .star-condensed-badge .star-badge-star {
            font-size: 12px;
        }

        .active-bubble-body {
            padding: 16px;
            max-height: 360px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            user-select: text;
        }

        .active-bubble-body::-webkit-scrollbar {
            width: 5px;
        }
        .active-bubble-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.18);
            border-radius: 4px;
        }

        .bubble-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
            animation: fadeIn 0.25s ease-out;
        }

        .bubble-row.user {
            align-items: flex-end;
        }

        .bubble-row.ai {
            align-items: flex-start;
        }

        .bubble-label {
            font-size: 11px;
            color: #64748b;
            padding: 0 4px;
        }

        .bubble-text {
            max-width: 90%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.55;
            word-break: break-word;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
        }

        .bubble-text.user {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #ffffff;
            border-bottom-right-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .bubble-text.ai {
            background: rgba(30, 41, 59, 0.85);
            color: #f1f5f9;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        /* 倒计时进度条 */
        .bubble-collapse-progress {
            height: 2px;
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            position: relative;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #38bdf8, #a5f3fc);
            transition: width linear;
        }

        /* 历史对话查看弹窗 (点击星星弹出) */
        .history-bubble-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 90;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .history-bubble-overlay.active {
            display: flex;
        }

        .history-bubble-card {
            width: 500px;
            max-width: calc(100vw - 36px);
            max-height: 80vh;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: modalIn 0.25s ease-out;
        }

        .history-card-header {
            padding: 14px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
        }

        .history-card-body {
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            user-select: text;
        }

        .history-card-footer {
            padding: 12px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.02);
        }

        /* 底部居中输入底栏 */
        .bottom-dock {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: 720px;
            max-width: calc(100vw - 32px);
            z-index: 10;
        }

        .input-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

        window.XingcaiCustomConfig = {

                if (defaultCursor) document.documentElement.style.setProperty('--app-cursor-default', defaultCursor);

                if (textCursor) document.documentElement.style.setProperty('--app-cursor-text', textCursor);

                if (svg) svg.style.display = 'none';

            setSendIconHtml: function(htmlString) {
                const container = document.querySelector('.send-btn-icon');
                if (container) {
                    document.documentElement.style.setProperty('--send-btn-icon-image', 'none');
                    container.innerHTML = htmlString;
                }
            },
            setSendButtonSize: function(sizePx, radiusPx = 8) {
                document.documentElement.style.setProperty('--send-btn-size', `${sizePx}px`);
                document.documentElement.style.setProperty('--send-btn-radius', `${radiusPx}px`);

        let isServerOnline = false;

        // ==========================================
        // 语音合成引擎 (Web Speech API - 实时语音输出与动作口型联动)
        // ==========================================
        class XingcaiVoiceEngine {
            constructor() {
                this.synth = (typeof window !== 'undefined' && 'speechSynthesis' in window) ? window.speechSynthesis : null;
                this.selectedVoice = null;
                this.isSpeaking = false;
                this.initVoice();
                if (this.synth && this.synth.onvoiceschanged !== undefined) {
                    this.synth.onvoiceschanged = () => this.initVoice();
                }
            }

            initVoice() {
                if (!this.synth) return;
                const voices = this.synth.getVoices();
                if (!voices || voices.length === 0) return;
                const zhVoices = voices.filter(v => v.lang && (v.lang.includes('zh') || v.lang.includes('cmn')));
                let pref = zhVoices.find(v => /xiaoxiao|yaoyao|huihui|xiaoyi|kangkang|chinese female/i.test(v.name));
                if (!pref) pref = zhVoices.find(v => /female|女/i.test(v.name));
                if (!pref && zhVoices.length > 0) pref = zhVoices[0];
                this.selectedVoice = pref || null;
            }

            cleanText(text) {
                if (!text) return '';
                return text
                    .replace(/<[^>]+>/g, '')
                    .replace(/\[(点头|摇头|歪头|害羞|脸红|眨眼|卖萌|微笑|开心|思考|沉思|惊讶|吃惊|换衣服|外套|脱外套|穿外套|裙子1|裙子2|nod|shake|tilt|blush|wink|smile|think|surprise|jacket|skirt1|skirt2)\]/gi, '')
                    .replace(/\[.*?\]/g, '')
                    .replace(/[*_#`~]/g, '')
                    .trim();
            }

            speak(text, onStart, onEnd) {
                if (!this.synth) {
                    if (onEnd) onEnd();
                    return;
                }
                const clean = this.cleanText(text);
                if (!clean) {
                    if (onEnd) onEnd();
                    return;
                }
                try {
                    this.synth.cancel();
                    const utt = new SpeechSynthesisUtterance(clean);
                    if (this.selectedVoice) utt.voice = this.selectedVoice;
                    utt.lang = 'zh-CN';
                    utt.rate = 1.0;
                    utt.pitch = 1.05;

                    utt.onstart = () => {
                        this.isSpeaking = true;
                        if (window.live2dMotionEngine) window.live2dMotionEngine.setSpeaking(true);
                        if (onStart) onStart();
                    };
                    utt.onend = () => {
                        this.isSpeaking = false;
                        if (window.live2dMotionEngine) window.live2dMotionEngine.setSpeaking(false);
                        if (onEnd) onEnd();
                    };
                    utt.onerror = () => {
                        this.isSpeaking = false;
                        if (window.live2dMotionEngine) window.live2dMotionEngine.setSpeaking(false);
                        if (onEnd) onEnd();
                    };
                    this.synth.speak(utt);
                } catch (e) {
                    console.warn('语音播放异常:', e);
                    if (window.live2dMotionEngine) window.live2dMotionEngine.setSpeaking(false);
                    if (onEnd) onEnd();
                }
            }

            stop() {
                if (this.synth) {
                    try { this.synth.cancel(); } catch (e) {}
                }
                this.isSpeaking = false;
                if (window.live2dMotionEngine) window.live2dMotionEngine.setSpeaking(false);
            }
        }

        class StreamVoiceSpeaker {
            constructor(voiceEngine) {
                this.voiceEngine = voiceEngine;
                this.spokenLength = 0;
                this.activeCount = 0;
            }

            feed(fullText) {
                if (!this.voiceEngine || !this.voiceEngine.synth) return;
                const remaining = fullText.slice(this.spokenLength);
                const sentenceRegex = /([^。！？；!?\n]+[。！？；!?\n])/g;
                let match;
                while ((match = sentenceRegex.exec(remaining)) !== null) {
                    const rawSentence = match[1];
                    this.spokenLength += rawSentence.length;
                    const clean = this.voiceEngine.cleanText(rawSentence);
                    if (clean) {
                        this.speakSentence(clean);
                    }
                }
            }

            finish(fullText) {
                if (!this.voiceEngine || !this.voiceEngine.synth) return;
                const remaining = fullText.slice(this.spokenLength);
                const clean = this.voiceEngine.cleanText(remaining);
                if (clean) {
                    this.speakSentence(clean);
                }
            }

            speakSentence(text) {
                try {
                    const utt = new SpeechSynthesisUtterance(text);
                    if (this.voiceEngine.selectedVoice) utt.voice = this.voiceEngine.selectedVoice;
                    utt.lang = 'zh-CN';
                    utt.rate = 1.0;
                    utt.pitch = 1.05;

                    this.activeCount++;
                    utt.onstart = () => {
                        if (window.live2dMotionEngine) window.live2dMotionEngine.setSpeaking(true);
                    };
                    utt.onend = () => {
                        this.activeCount = Math.max(0, this.activeCount - 1);
                        if (this.activeCount === 0 && window.live2dMotionEngine) {
                            window.live2dMotionEngine.setSpeaking(false);
                        }
                    };
                    utt.onerror = () => {
                        this.activeCount = Math.max(0, this.activeCount - 1);
                        if (this.activeCount === 0 && window.live2dMotionEngine) {
                            window.live2dMotionEngine.setSpeaking(false);
                        }
                    };
                    this.voiceEngine.synth.speak(utt);
                } catch (e) {
                    console.warn('流式语音播放异常:', e);
                }
            }
        }

        const voiceEngine = new XingcaiVoiceEngine();
        window.xingcaiVoiceEngine = voiceEngine;

        // 初始化
        window.addEventListener('DOMContentLoaded', async () => {
            // 安全策略：清除旧的明文缓存，优先从 session 中恢复已解密使用的活动地址
            localStorage.removeItem('llm_base_url');
            const activeUrl = sessionStorage.getItem('llm_active_url');

                window.localLLMClient.baseUrl = activeUrl;
            } else {
                window.localLLMClient.baseUrl = '';
            }

            loadStarHistory();

            initModelInteraction();

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, (m) => {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
            });
        }

        async function checkServerStatus() {
            statusBadge.className = 'status-badge';
            statusText.innerText = '检测服务...';
            const res = await window.localLLMClient.checkHealth();
            if (res.ok) {
                isServerOnline = true;
                statusBadge.className = 'status-badge';
                statusText.innerText = '本地大模型已连接';
            } else {
                isServerOnline = false;
                statusBadge.className = 'status-badge offline';
                statusText.innerText = '演示模式 (本地模型离线)';
            }

        // ==========================================
        // ==========================================
        // 椭圆星轨几何与公转动力学系统
        // 最大椭圆四个点位于去掉底部对话框后的屏幕上下左右正中，绝不转出屏幕
        // ==========================================
        let orbitBounds = {
            xc: 0,
            yc: 0,
            aMax: 0,
            bMax: 0
        };

        function updateEllipseBounds() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            const dockHeight = 84; // 去掉底部输入框及边距
            const usableH = Math.max(200, h - dockHeight);
            const pad = 28; // 边缘安全边距，确保星芒完整不贴边

            // 旋转中心：最大椭圆的中心
            orbitBounds.xc = w * 0.5;
            orbitBounds.yc = usableH * 0.5;

            // 最大椭圆的半长轴 (水平) 与半短轴 (垂直)
            // 确保四个极点恰好落在屏幕左、右、上及输入框上方的正中
            orbitBounds.aMax = Math.max(50, w * 0.5 - pad);
            orbitBounds.bMax = Math.max(50, usableH * 0.5 - pad);
        }

        let orbitDuration = 240; // 顺时针公转一圈耗时 (秒)
        let lastOrbitTimestamp = performance.now();
        let isOrbitLoopRunning = false;

        function startCelestialOrbitLoop() {
            if (isOrbitLoopRunning) return;
            isOrbitLoopRunning = true;
            updateEllipseBounds();
            window.addEventListener('resize', updateEllipseBounds);

            function orbitStep(now) {
                const dt = Math.min(0.1, (now - lastOrbitTimestamp) / 1000);
                lastOrbitTimestamp = now;

                const omega = (2 * Math.PI) / orbitDuration; // 顺时针角速度

                for (let i = 0; i < starHistory.length; i++) {
                    const starData = starHistory[i];
                    if (starData._dissolving) continue;

                    // 鼠标悬浮时静止停留，方便交互阅读记忆卡片，移开后平稳恢复公转
                    if (!starData._paused) {
                        starData.angle = (starData.angle || 0) + omega * dt;
                        if (starData.angle > Math.PI * 2) {
                            starData.angle -= Math.PI * 2;
                        }
                    }

                    const starEl = document.getElementById(`star-${starData.id}`);
                    if (starEl) {
                        const scale = starData.orbitScale || 0.68;
                        const a = scale * orbitBounds.aMax;
                        const b = scale * orbitBounds.bMax;
                        const curX = orbitBounds.xc + a * Math.cos(starData.angle);
                        const curY = orbitBounds.yc + b * Math.sin(starData.angle);
                        starEl.style.transform = `translate(${curX.toFixed(2)}px, ${curY.toFixed(2)}px) translate(-50%, -50%)`;
                    }
                }

                requestAnimationFrame(orbitStep);
            }

            requestAnimationFrame(orbitStep);
        }

        function loadStarHistory() {
            try {
                const stored = localStorage.getItem('xingcai_star_history');
                if (stored) {
                    starHistory = JSON.parse(stored);
                    starsContainer.innerHTML = '';
                    updateEllipseBounds();
                    starHistory.forEach(item => {
                        // 兼容旧版百分比坐标：若无 orbitScale 则平滑映射入椭圆轨道
                        if (item.orbitScale === undefined) {
                            const rawX = (item.x / 100) * window.innerWidth;
                            const rawY = (item.y / 100) * window.innerHeight;
                            const dx = rawX - orbitBounds.xc;
                            const dy = rawY - orbitBounds.yc;
                            item.angle = Math.atan2(dy / orbitBounds.bMax, dx / orbitBounds.aMax);
                            const r = Math.sqrt(Math.pow(dx / orbitBounds.aMax, 2) + Math.pow(dy / orbitBounds.bMax, 2));
                            item.orbitScale = Math.min(0.95, Math.max(0.4, r || 0.68));
                        }
                        const starEl = createStarElement(item);
                        starsContainer.appendChild(starEl);
                    });
                }
                startCelestialOrbitLoop();
            } catch (e) {
                console.warn('加载历史星辰失败:', e);
                starHistory = [];
                startCelestialOrbitLoop();
            }
        }

        function createStarElement(starData) {
            const el = document.createElement('div');
            el.className = 'sky-star';
            el.id = `star-${starData.id}`;
            el.style.color = starData.color.color;

            // 缓慢漂浮参数 (小幅度上下漂浮 5~8.5s)
            const floatDuration = (5.5 + Math.random() * 3).toFixed(1);
            const floatDelay = (Math.random() * 4).toFixed(1);

            // 星系大尺度轴向自转参数 (调慢至约 0.25 倍速，72~120s)
            const spinDuration = ((18 + Math.random() * 12) * 4).toFixed(1);
            const spinDirection = Math.random() > 0.5 ? 'normal' : 'reverse';

            // 星光闪烁脉动参数
            const twinkleDuration = (2.5 + Math.random() * 2).toFixed(1);
            const twinkleDelay = (Math.random() * 3).toFixed(1);

            const shortText = (starData.summary || starData.userText || '').substring(0, 18);

            // 初始坐标立即定位
            const scale = starData.orbitScale || 0.68;
            const a = scale * orbitBounds.aMax;
            const b = scale * orbitBounds.bMax;
            const curX = orbitBounds.xc + a * Math.cos(starData.angle || 0);
            const curY = orbitBounds.yc + b * Math.sin(starData.angle || 0);
            el.style.transform = `translate(${curX.toFixed(2)}px, ${curY.toFixed(2)}px) translate(-50%, -50%)`;

            el.innerHTML = `
                <div class="star-body">
                    <div class="star-float-box" style="animation-duration:${floatDuration}s; animation-delay:${floatDelay}s;">
                        <div class="star-galaxy-spinner" style="animation-duration:${spinDuration}s; animation-direction:${spinDirection};">
                            <div class="star-icon" style="animation-duration:${twinkleDuration}s; animation-delay:${twinkleDelay}s;">
                                <svg viewBox="0 0 24 24">
                                    <path d="M12 0 L14.8 9.2 L24 12 L14.8 14.8 L12 24 L9.2 14.8 L0 12 L9.2 9.2 Z" fill="currentColor" />
                                </svg>
                            </div>
                        </div>
                    </div>
                    <div class="star-tooltip">
                        <div class="star-tooltip-title">✨ 记忆星芒</div>
                        <div class="star-tooltip-text">${escapeHtml(shortText)}</div>
                    </div>
                </div>
            `;

            // 悬停时停止公转漂移，方便阅读与点击
            el.addEventListener('mouseenter', () => {
                starData._paused = true;
            });
            el.addEventListener('mouseleave', () => {
                starData._paused = false;
            });

            el.addEventListener('click', (e) => {
                e.stopPropagation();
                openHistoryBubble(starData);
            });

            return el;
        }

        // ==========================================
        // 星辰化作尘埃消散特效 (消散速度调慢为原先的 0.25 倍左右，3.2s)
        // ==========================================
        function disintegrateStar(starEl, colorObj, onComplete) {
            if (!starEl) {
                if (onComplete) onComplete();
                return;
            }

            const id = starEl.id ? starEl.id.replace('star-', '') : null;
            const starData = starHistory.find(s => String(s.id) === String(id));
            if (starData) {
                starData._dissolving = true;
            }

            const rect = starEl.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            // 1. 触发星星主体能量耀斑与缓慢坍缩消散
            starEl.classList.add('star-dissolving');

            // 2. 释放弥漫的宇宙尘埃微粒云与慢速扩散光环
            const baseColor = (colorObj && colorObj.color) || starEl.style.color || '#38bdf8';
            const glowColor = (colorObj && colorObj.glow) || 'rgba(56, 189, 248, 0.6)';
            spawnCosmicDustCloud(centerX, centerY, baseColor, glowColor);

            // 3. 动画结束后安全清理 DOM (3200ms)
            setTimeout(() => {
                if (starEl.parentNode) {
                    starEl.remove();
                }
                if (onComplete) onComplete();
            }, 3200);
        }

        function spawnCosmicDustCloud(centerX, centerY, baseColor, glowColor) {
            // 弥散的宇宙微波微型光晕 (慢速外溢膨胀，约 2.6s~3.4s)
            for (let h = 0; h < 2; h++) {
                const halo = document.createElement('div');
                halo.className = 'cosmic-dust-halo';
                halo.style.left = `${centerX}px`;
                halo.style.top = `${centerY}px`;
                halo.style.width = `${24 + h * 16}px`;
                halo.style.height = `${24 + h * 16}px`;
                halo.style.background = `radial-gradient(circle, ${baseColor} 0%, ${glowColor} 50%, transparent 75%)`;
                effectContainer.appendChild(halo);

                const haloAnim = halo.animate([
                    { transform: 'translate(-50%, -50%) scale(0.25)', opacity: 0.9 },
                    { transform: 'translate(-50%, -50%) scale(2.6)', opacity: 0 }
                ], {
                    duration: (650 + h * 180) * 4,
                    easing: 'cubic-bezier(0.18, 0.89, 0.32, 1.15)',
                    fill: 'forwards'
                });
                haloAnim.onfinish = () => halo.remove();
            }

            // 细腻微光尘埃粒子 (18 ~ 26 颗极度轻盈升腾飘散，持续 3.2s ~ 5.0s)
            const particleCount = 18 + Math.floor(Math.random() * 8);
            for (let i = 0; i < particleCount; i++) {
                const dust = document.createElement('div');
                dust.className = 'cosmic-dust-particle';

                // 细小尘埃尺寸 (1.4px ~ 3.8px)
                const size = (1.4 + Math.random() * 2.4).toFixed(1);
                dust.style.width = `${size}px`;
                dust.style.height = `${size}px`;

                // 颜色混配：白金微光与星辰主题辉光相间
                const isWhite = Math.random() > 0.5;
                const pColor = isWhite ? '#ffffff' : baseColor;
                dust.style.backgroundColor = pColor;
                dust.style.boxShadow = isWhite
                    ? '0 0 5px #ffffff, 0 0 10px rgba(255, 255, 255, 0.8)'
                    : `0 0 6px ${baseColor}, 0 0 12px ${glowColor}`;

                dust.style.left = `${centerX}px`;
                dust.style.top = `${centerY}px`;
                effectContainer.appendChild(dust);

                // 物理飘散轨迹：向四方初散后，受微引力极缓升腾并侧滑
                const angle = Math.random() * Math.PI * 2;
                const speed = 28 + Math.random() * 64; // 径向飞散距离
                const upwardLift = -(26 + Math.random() * 46); // 升腾漂浮位移
                const driftX = (Math.random() - 0.5) * 34; // 水平侧滑漂动

                const midX = Math.cos(angle) * (speed * 0.5) + driftX * 0.35;
                const midY = Math.sin(angle) * (speed * 0.5) + upwardLift * 0.35;
                const endX = Math.cos(angle) * speed + driftX;
                const endY = Math.sin(angle) * speed + upwardLift;

                const duration = (800 + Math.random() * 450) * 4; // 3200ms ~ 5000ms
                const delay = Math.random() * 180;

                const anim = dust.animate([
                    {
                        transform: 'translate(-50%, -50%) translate(0, 0) scale(0.3)',
                        opacity: 0
                    },
                    {
                        transform: `translate(-50%, -50%) translate(${midX}px, ${midY}px) scale(1.3)`,
                        opacity: 1,
                        offset: 0.16
                    },
                    {
                        transform: `translate(-50%, -50%) translate(${midX + (endX - midX) * 0.5}px, ${midY + (endY - midY) * 0.5}px) scale(0.95)`,
                        opacity: 0.75,
                        offset: 0.65
                    },
                    {
                        transform: `translate(-50%, -50%) translate(${endX}px, ${endY}px) scale(0)`,
                        opacity: 0,
                        offset: 1
                    }
                ], {
                    duration: duration,
                    delay: delay,
                    easing: 'cubic-bezier(0.12, 0.8, 0.32, 1)',
                    fill: 'forwards'
                });

                anim.onfinish = () => dust.remove();
            }
        }

        function deleteStar(id) {
            const starEl = document.getElementById(`star-${id}`);
            const starData = starHistory.find(s => String(s.id) === String(id));
            const colorObj = starData ? starData.color : null;

            if (starEl) {
                disintegrateStar(starEl, colorObj);
            }
            starHistory = starHistory.filter(s => String(s.id) !== String(id));
            localStorage.setItem('xingcai_star_history', JSON.stringify(starHistory));
        }

        let isClearingStars = false;

        clearChatBtn.addEventListener('click', () => {
            if (isClearingStars || isGenerating || isCondensing) return;
            if (starHistory.length === 0 && currentSessionMessages.length === 0 && chatHistory.length === 0 && !activeDialogBubble.classList.contains('visible')) return;
            if (!confirm('确定要清理夜空中的所有对话星辰并重置对话记忆吗？')) return;

            isClearingStars = true;
            clearChatBtn.style.opacity = '0.5';
            clearChatBtn.style.pointerEvents = 'none';

            // 停止当前所有语音播放并关闭历史弹窗
            if (voiceEngine) {
                voiceEngine.stop();
            }
            closeHistoryBubble();

            // 彻底清理并重置上下文记忆与当前会话
            chatHistory = [];
            currentSessionMessages = [];

            // 1. 若当前对话框中有内容，同样化作柔和尘埃消散并清空
            if (activeDialogBubble.classList.contains('visible')) {
                const bubble = activeDialogBubble;
                const rect = bubble.getBoundingClientRect();
                const bx = rect.left + rect.width / 2;
                const by = rect.top + rect.height / 2;
                spawnCosmicDustCloud(bx, by, '#38bdf8', 'rgba(56, 189, 248, 0.6)');
                bubble.classList.remove('visible');
                activeBubbleBody.innerHTML = '';
            }

            const starElements = Array.from(starsContainer.querySelectorAll('.sky-star'));
            const totalStars = starElements.length;

            if (totalStars === 0) {
                finishClear();
                return;
            }

            // 2. 波浪涟漪式群星依次解构化作尘埃消散 (错峰启动)
            let finishedCount = 0;
            starElements.forEach((starEl, index) => {
                const delay = Math.min(index * 120, 1200) + Math.random() * 40;
                setTimeout(() => {
                    const id = starEl.id ? starEl.id.replace('star-', '') : null;
                    const starData = starHistory.find(s => String(s.id) === String(id));
                    const colorObj = starData ? starData.color : null;

                    disintegrateStar(starEl, colorObj, () => {
                        finishedCount++;
                        if (finishedCount >= totalStars) {
                            finishClear();
                        }
                    });
                }, delay);
            });

            function finishClear() {
                starsContainer.innerHTML = '';
                starHistory = [];
                chatHistory = [];
                currentSessionMessages = [];
                localStorage.removeItem('xingcai_star_history');
                isClearingStars = false;
                clearChatBtn.style.opacity = '';
                clearChatBtn.style.pointerEvents = '';
            }
        });

        // ==========================================
        // 流星划过与粒子特效
        // ==========================================
        function shootMeteor(fromX, fromY, toX, toY, colorObj, onComplete) {
            const meteor = document.createElement('div');
            meteor.className = 'shooting-meteor';
            meteor.style.left = `${fromX}px`;
            meteor.style.top = `${fromY}px`;
            meteor.style.backgroundColor = '#ffffff';
            meteor.style.boxShadow = `0 0 16px 4px ${colorObj.color}, 0 0 32px 8px ${colorObj.glow}`;

            const tail = document.createElement('div');
            tail.className = 'shooting-meteor-tail';
            tail.style.background = `linear-gradient(to left, #ffffff 10%, ${colorObj.color} 50%, rgba(0,0,0,0) 100%)`;
            tail.style.filter = `drop-shadow(0 0 6px ${colorObj.color})`;
            meteor.appendChild(tail);

            effectContainer.appendChild(meteor);

            const deltaX = toX - fromX;
            const deltaY = toY - fromY;
            const angleDeg = Math.atan2(deltaY, deltaX) * (180 / Math.PI);

            const anim = meteor.animate([
                { transform: `translate(0px, 0px) rotate(${angleDeg}deg) scale(0.2)`, opacity: 0 },
                { transform: `translate(${deltaX * 0.15}px, ${deltaY * 0.15}px) rotate(${angleDeg}deg) scale(1)`, opacity: 1, offset: 0.15 },
                { transform: `translate(${deltaX * 0.9}px, ${deltaY * 0.9}px) rotate(${angleDeg}deg) scale(0.85)`, opacity: 1, offset: 0.9 },
                { transform: `translate(${deltaX}px, ${deltaY}px) rotate(${angleDeg}deg) scale(0.1)`, opacity: 0, offset: 1 }
            ], {
                duration: 750,
                easing: 'cubic-bezier(0.22, 0.61, 0.36, 1)'
            });

            anim.onfinish = () => {
                meteor.remove();
                spawnStardustBurst(toX, toY, colorObj.color);

        function spawnStardustBurst(x, y, color) {
            const particleCount = 8;
            for (let i = 0; i < particleCount; i++) {
                const p = document.createElement('div');
                p.className = 'stardust-spark';
                const angle = (i / particleCount) * Math.PI * 2 + (Math.random() * 0.5);
                const dist = 18 + Math.random() * 24;
                const dx = Math.cos(angle) * dist;
                const dy = Math.sin(angle) * dist;
                const size = 3 + Math.random() * 3;

                p.style.left = `${x}px`;
                p.style.top = `${y}px`;
                p.style.width = `${size}px`;
                p.style.height = `${size}px`;
                p.style.backgroundColor = color;
                p.style.boxShadow = `0 0 8px ${color}`;
                p.style.setProperty('--dx', `${dx}px`);
                p.style.setProperty('--dy', `${dy}px`);
                effectContainer.appendChild(p);

            const summaryPromise = generateDialogueSummary(currentSessionMessages);
            const waitMinTime = new Promise(resolve => setTimeout(resolve, 2200));
            const [summary] = await Promise.all([summaryPromise, waitMinTime]);

            // 发射流星至夜空椭圆轨道
            const rect = condenseStarBtn.getBoundingClientRect();

            const orbitScale = 0.42 + Math.random() * 0.52;
            const initialAngle = Math.random() * Math.PI * 2;
            const a = orbitScale * orbitBounds.aMax;
            const b = orbitScale * orbitBounds.bMax;
            const toX = orbitBounds.xc + a * Math.cos(initialAngle);
            const toY = orbitBounds.yc + b * Math.sin(initialAngle);
            const colorObj = STAR_PALETTE[Math.floor(Math.random() * STAR_PALETTE.length)];

            const starData = {

                orbitScale: orbitScale,
                angle: initialAngle,
                color: colorObj

            // 发射流星动画并在夜空生成星芒

        /**
         * 根据对话内容生成极简描述短语 (替代“我说的话”，作为星芒的描述)
         */
        async function generateDialogueSummary(sessionMessages) {
            if (!sessionMessages || sessionMessages.length === 0) {
                return '片刻思绪';
            }

            if (isServerOnline) {
                try {
                    const text = sessionMessages
                        .map(m => (m.role === 'user' ? '用户: ' : '星彩: ') + voiceEngine.cleanText(m.content))
                        .join('\n');
                    const res = await window.localLLMClient.generateSummary(text);
                    if (res && res.trim()) {
                        const clean = res.trim()
                            .replace(/^["'“‘【《]|["'”’】》]$/g, '')
                            .replace(/[。！？\n]/g, '')
                            .slice(0, 16);
                        if (clean) return clean;
                    }
                } catch (e) {
                    console.warn('在线生成短语失败，切换为规则提炼:', e);
                }
            }

            return extractRuleBasedSummary(sessionMessages);
        }

        function extractRuleBasedSummary(sessionMessages) {
            const allText = sessionMessages.map(m => m.content).join(' ');

            if (/以太|麦克斯韦|电磁|电|磁/i.test(allText)) return '麦克斯韦电磁理论之辨';
            if (/冲力|布里丹|伽利略|落体/i.test(allText)) return '中世纪冲力说与经典力学';
            if (/神曲|但丁|托勒密|天体|天球/i.test(allText)) return '《神曲》九重天界与天体模型';
            if (/熵|热力学|时间之箭|混沌|无序/i.test(allText)) return '热力学第二定律与时间之箭';
            if (/力学|牛顿|引力|重力|万有引力/i.test(allText)) return '经典力学体系与引力之思';
            if (/量子|波函数|薛定谔|不确定/i.test(allText)) return '微观量子世界与波动之论';
            if (/亚里士多德|经院|自然哲学/i.test(allText)) return '亚里士多德与自然哲学辨析';
            if (/文学|古典|诗|辞章/i.test(allText)) return '古典文学与辞章意趣品读';
            if (/衣服|外套|换衣服|装束|容装/i.test(allText)) return '关于衣着整肃之闲谈';
            if (/你好|幸会|初见|在吗/i.test(allText)) return '初晤论道之浅谈问候';

            for (const m of sessionMessages) {
                const clean = voiceEngine.cleanText(m.content);
                if (clean.length >= 4) {
                    return clean.slice(0, 12) + (clean.length > 12 ? '...' : '');
                }
            }
            return '格物致知片刻沉思';
        }

        async function handleSend() {

        async function sendToLocalLLM(textEl, time) {
            let fullContent = '';
            let parsedTags = new Set();
            statusText.innerText = '星彩正在回复...';

            const streamSpeaker = new StreamVoiceSpeaker(voiceEngine);

            await new Promise((resolve) => {
                window.localLLMClient.chatStream(
                    chatHistory,
                    (chunk) => {
                        fullContent += chunk;
                        const matches = fullContent.match(/\[(点头|摇头|歪头|害羞|脸红|眨眼|卖萌|微笑|开心|思考|沉思|惊讶|吃惊|换衣服|外套|脱外套|穿外套|裙子1|裙子2|nod|shake|tilt|blush|wink|smile|think|surprise|jacket|skirt1|skirt2)\]/gi);
                        if (matches) {
                            for (const tag of matches) {
                                const clean = tag.replace(/[\[\]]/g, '').toLowerCase();
                                if (!parsedTags.has(clean)) {
                                    parsedTags.add(clean);
                                    window.live2dMotionEngine.triggerAction(clean);
                                }
                            }
                        }
                        textEl.innerHTML = formatActionTags(fullContent) + '<span class="cursor-blink"></span>';
                        activeBubbleBody.scrollTop = activeBubbleBody.scrollHeight;
                        // 实时语音输出
                        streamSpeaker.feed(fullContent);
                    },
                    () => {
                        streamSpeaker.finish(fullContent);
                        textEl.innerHTML = formatActionTags(fullContent);
                        currentSessionMessages.push({ role: 'assistant', content: fullContent, time: time });
                        chatHistory.push({ role: 'assistant', content: fullContent });
                        activeBubbleBody.scrollTop = activeBubbleBody.scrollHeight;
                        resolve();
                    },
                    (err) => {
                        console.warn('本地大模型流式传输中断，切换为演示应答:', err);
                        const fallback = window.localLLMClient.getMockResponse(chatHistory[chatHistory.length - 1].content);
                        typewriterOutput(fallback, textEl, time, resolve);
                    }
                );
            });
        }

        async function sendToMockEngine(userText, textEl, time) {
            const mockReply = window.localLLMClient.getMockResponse(userText);
            await new Promise((resolve) => {
                typewriterOutput(mockReply, textEl, time, resolve);
            });
        }

        function typewriterOutput(fullText, textEl, time, onFinished) {
            let index = 0;
            let currentText = '';
            let parsedTags = new Set();
            statusText.innerText = '星彩正在回复...';

            // 文字输出的同时输出语音
            voiceEngine.speak(fullText);

            const timer = setInterval(() => {
                if (index < fullText.length) {
                    currentText += fullText[index];
                    index++;

                    const matches = currentText.match(/\[(点头|摇头|歪头|害羞|脸红|眨眼|卖萌|微笑|开心|思考|沉思|惊讶|吃惊|换衣服|外套|脱外套|穿外套|裙子1|裙子2|nod|shake|tilt|blush|wink|smile|think|surprise|jacket|skirt1|skirt2)\]/gi);
                    if (matches) {
                        for (const tag of matches) {
                            const clean = tag.replace(/[\[\]]/g, '').toLowerCase();
                            if (!parsedTags.has(clean)) {
                                parsedTags.add(clean);
                                window.live2dMotionEngine.triggerAction(clean);
                            }
                        }
                    }

                    textEl.innerHTML = formatActionTags(currentText) + '<span class="cursor-blink"></span>';
                    activeBubbleBody.scrollTop = activeBubbleBody.scrollHeight;
                } else {
                    clearInterval(timer);
                    textEl.innerHTML = formatActionTags(fullText);
                    currentSessionMessages.push({ role: 'assistant', content: fullText, time: time });
                    chatHistory.push({ role: 'assistant', content: fullText });
                    activeBubbleBody.scrollTop = activeBubbleBody.scrollHeight;
                    onFinished();
                }
            }, 38);
        }

        function initModelInteraction() {
            const canvas = document.querySelector('canvas');
            if (!canvas) {
                setTimeout(initModelInteraction, 400);
                return;
            }

            let pointerStartX = 0;
            let pointerStartY = 0;
            let pointerStartTime = 0;

            function getScreenCoords(clientX, clientY) {
                const view = window.LAppDelegate && window.LAppDelegate.getInstance().getView();
                if (view && view._deviceToScreen) {
                    const dpr = window.devicePixelRatio || 1;
                    const s = view.transformScreenX(clientX * dpr);
                    const a = view.transformScreenY(clientY * dpr);
                    return { s, a };
                }
                return null;
            }

            // 悬停在人物模型区域时光标变为手型 (pointer)
            window.addEventListener('mousemove', (e) => {
                if (e.target.closest && (e.target.closest('.top-navbar') || e.target.closest('.active-dialog-bubble') || e.target.closest('.bottom-dock') || e.target.closest('.drawer-overlay') || e.target.closest('.history-bubble-overlay') || e.target.closest('.sky-star'))) {
                    document.body.style.cursor = '';
                    return;
                }
                const coords = getScreenCoords(e.clientX, e.clientY);
                if (coords && window.live2dMotionEngine && window.live2dMotionEngine.isHitModel(coords.s, coords.a)) {
                    document.body.style.cursor = 'var(--app-cursor-pointer)';
                } else {
                    document.body.style.cursor = '';
                }
            }, { passive: true });

            canvas.addEventListener('pointerdown', (e) => {
                pointerStartX = e.clientX;
                pointerStartY = e.clientY;
                pointerStartTime = Date.now();
            }, { passive: true });

            canvas.addEventListener('pointerup', (e) => {
                const dist = Math.hypot(e.clientX - pointerStartX, e.clientY - pointerStartY);
                const duration = Date.now() - pointerStartTime;
                // 单击且位移小于10px判定为点击人物
                if (dist < 10 && duration < 500) {
                    const coords = getScreenCoords(e.clientX, e.clientY);
                    if (coords && window.live2dMotionEngine && window.live2dMotionEngine.isHitModel(coords.s, coords.a)) {
                        triggerCharacterInitiateTopic();
                    }
                }
            }, { passive: true });

            // 同时挂钩 LAppLive2DManager 的 onTap 回调作为双重保障
            const checkMgrTimer = setInterval(() => {
                if (window.LAppLive2DManager) {
                    const mgr = window.LAppLive2DManager.getInstance();
                    if (mgr && mgr.onTap) {
                        const originalOnTap = mgr.onTap.bind(mgr);
                        mgr.onTap = function(s, a) {
                            originalOnTap(s, a);
                            if (window.live2dMotionEngine && window.live2dMotionEngine.isHitModel(s, a)) {
                                triggerCharacterInitiateTopic();
                            }
                        };
                        clearInterval(checkMgrTimer);
                    }
                }
            }, 300);
        }

        // ==========================================
        // 预设 GitHub 源码密文（可选）：
        // 若希望将加密后的 API 地址直接保存在公开 GitHub 仓库中，可将设置框中生成的密文粘贴于此处。
        // 在公开代码中绝无明文，只有在网页中输入对应密码者才可解密使用。
        window.REPO_ENCRYPTED_API = "";

        const CryptoService = {
            async deriveKey(password, salt) {
                const enc = new TextEncoder();
                const keyMaterial = await crypto.subtle.importKey(
                    'raw',
                    enc.encode(password),
                    'PBKDF2',
                    false,
                    ['deriveKey']
                );
                return crypto.subtle.deriveKey(
                    {
                        name: 'PBKDF2',
                        salt: salt,
                        iterations: 100000,
                        hash: 'SHA-256'
                    },
                    keyMaterial,
                    { name: 'AES-GCM', length: 256 },
                    false,
                    ['encrypt', 'decrypt']
                );
            },

            async encrypt(text, password) {
                const salt = crypto.getRandomValues(new Uint8Array(16));
                const iv = crypto.getRandomValues(new Uint8Array(12));
                const key = await this.deriveKey(password, salt);
                const enc = new TextEncoder();
                const encrypted = await crypto.subtle.encrypt(
                    { name: 'AES-GCM', iv: iv },
                    key,
                    enc.encode(text)
                );
                const payload = {
                    salt: Array.from(salt),
                    iv: Array.from(iv),
                    data: Array.from(new Uint8Array(encrypted))
                };
                return btoa(JSON.stringify(payload));
            },

            async decrypt(cipherBase64, password) {
                const payload = JSON.parse(atob(cipherBase64));
                const salt = new Uint8Array(payload.salt);
                const iv = new Uint8Array(payload.iv);
                const data = new Uint8Array(payload.data);
                const key = await this.deriveKey(password, salt);
                const decrypted = await crypto.subtle.decrypt(
                    { name: 'AES-GCM', iv: iv },
                    key,
                    data
                );
                return new TextDecoder().decode(decrypted);
            }
        };

        let isSettingsUnlocked = false;
        let currentSessionPassword = '';

        function getStoredCipher() {
            return localStorage.getItem('llm_encrypted_payload') || window.REPO_ENCRYPTED_API || '';
        }

        function updateSettingsModalView() {
            const cipher = getStoredCipher();
            const hasConfig = Boolean(cipher);

            testConnResult.innerText = '';

            if (!hasConfig && !isSettingsUnlocked) {
                // 首次使用，尚未设置任何配置
                groupMaskedUrl.style.display = 'none';
                groupRealUrl.style.display = 'flex';
                groupUnlockPwd.style.display = 'flex';
                pwdPromptLabel.innerText = '首次配置：请设置访问密码';
                settingPasswordInput.placeholder = '请设置访问密码...';
                settingPasswordInput.value = '';
                unlockSettingsBtn.style.display = 'none';
                unlockMsg.innerHTML = '<span style="color:#38bdf8;">💡 首次设置：请输入 API 地址并设置管理密码，系统将使用 AES-256 加密存储。</span>';
                groupChangePwd.style.display = 'none';
                groupGithubSync.style.display = 'none';
                lockNowBtn.style.display = 'none';
                saveSettingsBtn.style.display = 'inline-block';
                saveSettingsBtn.innerText = '💾 加密保存';
                settingBaseUrl.value = window.localLLMClient.baseUrl || '';
                settingBaseUrl.type = 'text';
                toggleUrlPlainBtn.innerText = '🙈 隐藏明文';
            } else if (!isSettingsUnlocked) {
                // 已有配置，处于锁定状态
                groupMaskedUrl.style.display = 'flex';
                groupRealUrl.style.display = 'none';
                groupUnlockPwd.style.display = 'flex';
                pwdPromptLabel.innerText = '输入管理密码以查看或更改';
                settingPasswordInput.placeholder = '输入密码解锁...';
                settingPasswordInput.value = '';
                unlockSettingsBtn.style.display = 'inline-block';
                unlockMsg.innerText = '';
                groupChangePwd.style.display = 'none';
                groupGithubSync.style.display = 'none';
                lockNowBtn.style.display = 'none';
                saveSettingsBtn.style.display = 'none';

                if (window.localLLMClient.baseUrl) {
                    maskedStatusHint.innerText = '大模型服务已连接就绪。如需查看明文或更改 API 地址，请输入密码解锁。';
                } else {
                    maskedStatusHint.innerText = 'API 地址已通过 AES-256 加密隐藏，输入密码解锁后方可连接与使用。';
                }
            } else {
                // 已解锁状态
                groupMaskedUrl.style.display = 'none';
                groupRealUrl.style.display = 'flex';
                groupUnlockPwd.style.display = 'none';
                groupChangePwd.style.display = 'flex';
                settingNewPasswordInput.value = '';
                groupGithubSync.style.display = 'block';
                cipherOutputText.value = cipher;
                lockNowBtn.style.display = 'inline-block';
                saveSettingsBtn.style.display = 'inline-block';
                saveSettingsBtn.innerText = '💾 加密保存';
            }
        }

        async function handleUnlock() {
            const cipher = getStoredCipher();
            if (!cipher) return;

            const pwd = settingPasswordInput.value;
            if (!pwd) {
                unlockMsg.style.color = '#f87171';
                unlockMsg.innerText = '请输入管理密码';
                return;
            }

            unlockMsg.style.color = '#38bdf8';
            unlockMsg.innerText = '正在验证密码并解密...';

            try {
                const decryptedUrl = await CryptoService.decrypt(cipher, pwd);
                if (!decryptedUrl) {
                    throw new Error('解密结果为空');
                }

                currentSessionPassword = pwd;
                isSettingsUnlocked = true;
                window.localLLMClient.saveSettings({ baseUrl: decryptedUrl });
                sessionStorage.setItem('llm_active_url', decryptedUrl);

                settingBaseUrl.value = decryptedUrl;
                settingBaseUrl.type = 'password';
                toggleUrlPlainBtn.innerText = '👁️ 显示明文';

                updateSettingsModalView();
                testConnResult.style.color = '#34d399';
                testConnResult.innerText = '✅ 密码正确，已解锁！';
                await checkServerStatus();
            } catch (err) {
                console.warn('Decryption failed:', err);
                unlockMsg.style.color = '#f87171';
                unlockMsg.innerText = '❌ 密码错误，无法解锁 API 地址';
            }
        }

        // ==========================================
        // 模型设置 Drawer 交互
        // ==========================================
        openSettingsBtn.addEventListener('click', () => {
            updateSettingsModalView();
            settingsDrawer.classList.add('active');
        });

        const closeDrawer = () => {
            settingsDrawer.classList.remove('active');
        };
        closeSettingsBtn.addEventListener('click', closeDrawer);
        closeSettingsModalBtn.addEventListener('click', closeDrawer);
        settingsDrawer.addEventListener('click', (e) => {
            if (e.target === settingsDrawer) {
                closeDrawer();
            }
        });

        unlockSettingsBtn.addEventListener('click', handleUnlock);
        settingPasswordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleUnlock();
            }
        });

        toggleUrlPlainBtn.addEventListener('click', () => {
            if (settingBaseUrl.type === 'password') {
                settingBaseUrl.type = 'text';
                toggleUrlPlainBtn.innerText = '🙈 隐藏明文';
            } else {
                settingBaseUrl.type = 'password';
                toggleUrlPlainBtn.innerText = '👁️ 显示明文';
            }
        });

        lockNowBtn.addEventListener('click', () => {
            isSettingsUnlocked = false;
            updateSettingsModalView();
        });

        saveSettingsBtn.addEventListener('click', async () => {
            const rawUrl = settingBaseUrl.value.trim();
            if (!rawUrl) {
                testConnResult.style.color = '#f87171';
                testConnResult.innerText = 'API 地址不能为空';
                return;
            }

            let pwdToUse = '';
            const cipher = getStoredCipher();
            if (!cipher) {
                pwdToUse = settingPasswordInput.value;
                if (!pwdToUse) {
                    unlockMsg.style.color = '#f87171';
                    unlockMsg.innerText = '首次配置必须设置管理密码！';
                    settingPasswordInput.focus();
                    return;
                }
            } else {
                const newPwd = settingNewPasswordInput.value;
                pwdToUse = newPwd || currentSessionPassword;
                if (!pwdToUse) {
                    testConnResult.style.color = '#f87171';
                    testConnResult.innerText = '未能获取管理密码，请重新输入密码解锁';
                    return;
                }
            }

            try {
                testConnResult.style.color = '#38bdf8';
                testConnResult.innerText = '正在加密保存...';

                const newCipher = await CryptoService.encrypt(rawUrl, pwdToUse);
                localStorage.setItem('llm_encrypted_payload', newCipher);
                localStorage.removeItem('llm_base_url');

                currentSessionPassword = pwdToUse;
                window.localLLMClient.saveSettings({ baseUrl: rawUrl });
                sessionStorage.setItem('llm_active_url', rawUrl);

                isSettingsUnlocked = false;
                updateSettingsModalView();

                testConnResult.style.color = '#34d399';
                testConnResult.innerText = '✅ API 地址已使用 AES-256 加密保存！';
                await checkServerStatus();
            } catch (err) {
                testConnResult.style.color = '#f87171';
                testConnResult.innerText = '❌ 加密保存失败: ' + err.message;
            }
        });

        testConnectionBtn.addEventListener('click', async () => {
            testConnResult.style.color = '#38bdf8';
            testConnResult.innerText = '正在测试连接...';

            if (isSettingsUnlocked) {
                const url = settingBaseUrl.value.trim();
                if (!url) {
                    testConnResult.style.color = '#f87171';
                    testConnResult.innerText = '请先填写 API 地址';
                    return;
                }
                window.localLLMClient.saveSettings({ baseUrl: url });
            } else {
                if (!window.localLLMClient.baseUrl) {
                    testConnResult.style.color = '#f87171';
                    testConnResult.innerText = '未配置或未解锁 API，请先输入密码解锁';
                    return;
                }
            }

            const res = await window.localLLMClient.checkHealth();
            if (res.ok) {
                testConnResult.style.color = '#34d399';
                testConnResult.innerText = '✅ 连接成功！服务正常在线';
                checkServerStatus();
            } else {
                testConnResult.style.color = '#f87171';
                testConnResult.innerText = '❌ 连接失败: ' + (res.error || '无法访问该地址');
            }
        });

        resetSettingsBtn.addEventListener('click', () => {
            if (!confirm('确定要清除所有 API 地址加密配置吗？')) return;
            localStorage.removeItem('llm_encrypted_payload');
            localStorage.removeItem('llm_base_url');
            sessionStorage.removeItem('llm_active_url');
            window.localLLMClient.baseUrl = '';
            currentSessionPassword = '';
            isSettingsUnlocked = false;
            updateSettingsModalView();
            testConnResult.style.color = '#94a3b8';
            testConnResult.innerText = '已清除所有本地加密配置';
            checkServerStatus();
        });

        copyCipherBtn.addEventListener('click', () => {
            cipherOutputText.select();
            navigator.clipboard.writeText(cipherOutputText.value).then(() => {
                const oldText = copyCipherBtn.innerText;
                copyCipherBtn.innerText = '已复制！';
                setTimeout(() => copyCipherBtn.innerText = oldText, 2000);
            });
        });
    </script>
</body>
</html>
